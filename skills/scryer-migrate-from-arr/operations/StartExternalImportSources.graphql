# Create the selected download clients and indexers in Scryer. Side effect:
# confirm first. Variables: {"requestKey": "<unique string>", "input": {
#   "sourceWarmupSessionIds": [...], "prowlarr": null,
#   "selectedDownloadClientDedupKeys": [...], "selectedIndexerDedupKeys": [...],
#   "downloadClientApiKeyOverrides": [{dedupKey, apiKey}],
#   "downloadClientPasswordOverrides": [{dedupKey, password}],
#   "indexerApiKeyOverrides": [{dedupKey, apiKey}]}}
mutation StartExternalImportSources($requestKey: String!, $input: ExecuteExternalImportInput!) {
  startExternalImportSources(requestKey: $requestKey, input: $input) {
    runId
    active
    ready
    items {
      key
      name
      kind
      state
      reason
    }
  }
}
