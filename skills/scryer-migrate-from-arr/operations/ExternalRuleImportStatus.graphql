# Read one rule import run and its per-format report. Read-only.
# Variables: {"runId": "<id from StartExternalRuleImport>"}
query ExternalRuleImportStatus($runId: ID!) {
  externalRuleImportStatus(runId: $runId) {
    runId
    status
    active
    phase
    reason
    message
    counts { total pending saved savedNeedsReview skippedExists failed }
    items { key sourceName savedName ruleSetId state reason facts { code details } }
    facts { code details }
  }
}
