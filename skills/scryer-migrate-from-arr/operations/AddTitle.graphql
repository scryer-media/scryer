# Add one title that has no files yet (the import does not create these).
# Side effect: confirm the whole batch first. Variables: {"input": {"name": "...",
#   "facet": "MOVIE"|"SERIES"|"ANIME", "libraryId": "...", "monitored": true, "tags": [],
#   "tmdbId": 0 | "tvdbId": "..." | "imdbId": "..."}}
mutation AddTitle($input: AddTitleInput!) {
  addTitle(input: $input) {
    reusedExistingTitle
    title {
      id
      name
      monitored
    }
  }
}
