# Grab, download, import and subtitle events for one title.
# Variables: {"titleIds": ["..."], "eventTypes": null, "limit": 25}
# eventTypes example: ["GRABBED", "DOWNLOAD_FAILED", "IMPORT_FAILED", "IMPORT_SKIPPED"]
# Subtitle types: SUBTITLE_DOWNLOADED, SUBTITLE_FAILED, SUBTITLE_DELETED, SUBTITLE_BLOCKLISTED
query TitleHistory($titleIds: [ID!], $eventTypes: [TitleHistoryEventTypeValue!], $limit: Int) {
  titleHistory(filter: { titleIds: $titleIds, eventTypes: $eventTypes, limit: $limit }) {
    hasMore
    items {
      eventType
      occurredAt
      sourceTitle
      sourceProvider
      clientName
      quality
      skipReason
      failureReasonCode
      failureReason
      blocklistReason
      filePlacements {
        placement
        linkFallback { cause reason osErrorCode }
      }
    }
  }
}
