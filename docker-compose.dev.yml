services:

  nzbget:
    image: lscr.io/linuxserver/nzbget:latest@sha256:b22a2b8b366d1e68e6341435bdabd9ff859642cc2ff4a04243d0723521d69d2e
    container_name: scryer-nzbget
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    ports:
      - "6789:6789"
    volumes:
      - ./tmp/nzbget/config:/config
      - ./tmp/nzbget-downloads:/nzbget-downloads

  nzbdav:
    image: nzbdav/nzbdav:latest@sha256:fc44a9d33adceddc4397eb660b4fcaf1917e23323fb80dea0645f56db129562f
    container_name: scryer-nzbdav
    hostname: scryer-nzbdav
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
    ports:
      - "3001:3000"
    volumes:
      - ./tmp/nzbdav/config:/config
      - ./tmp/nzbdav/mnt:/mnt/nzbdav
    networks:
      default:
        aliases:
          - scryer-sabnzbd

  altmount:
    image: ghcr.io/javi11/altmount:latest@sha256:cd02c5ee4a840a6a3fef486846ab9e1e61d704d7a04def9e53783b29add2ba0b
    container_name: scryer-altmount
    hostname: scryer-altmount
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      PORT: 8080
      JWT_SECRET: ${SCRYER_ALTMOUNT_JWT_SECRET:-scryer-dev-altmount-secret}
      COOKIE_DOMAIN: ${SCRYER_ALTMOUNT_COOKIE_DOMAIN:-localhost}
    ports:
      - "3002:8080"
    volumes:
      - ./tmp/altmount/config:/config
      - ./tmp/altmount/metadata:/metadata
      - ./tmp/altmount/mnt:/mnt/altmount
    networks:
      default:
        aliases:
          - scryer-altmount
    # Uncomment on Linux hosts if you want AltMount to manage an internal FUSE mount.
    # devices:
    #   - /dev/fuse:/dev/fuse:rwm
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - apparmor:unconfined

  decypharr:
    image: ghcr.io/sirrobot01/decypharr:latest@sha256:d9df495fd156a379abd5b760ad54ed960881408599cd045c4d552a6d20bc7ce6
    container_name: scryer-decypharr
    hostname: scryer-decypharr
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      UMASK: "002"
    ports:
      - "3003:8282"
    volumes:
      - ./tmp/decypharr/config:/config
      - ./tmp/decypharr/cache:/cache
      - ./tmp/decypharr/mnt:/mnt/decypharr
    networks:
      default:
        aliases:
          - scryer-decypharr
    # Uncomment on Linux hosts if you want Decypharr to manage an internal FUSE mount.
    # devices:
    #   - /dev/fuse:/dev/fuse:rwm
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - apparmor:unconfined

  # weaver:
  #   image: ghcr.io/scryer-media/weaver:latest
  #   container_name: scryer-weaver
  #   environment:
  #     RUST_LOG: info
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./tmp/weaver/data:/data
  #     - ./tmp/weaver-downloads:/weaver-downloads

  scryer:
    build:
      context: .
      dockerfile: docker/scryer-dev-runtime.Dockerfile
    container_name: scryer
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    working_dir: /workspace
    depends_on:
      - nzbget
      - nzbdav
      - altmount
      - decypharr
      # - weaver
    env_file:
      - crates/scryer/.env
    environment:
      SCRYER_BIND: 0.0.0.0:8080
#      SCRYER_METRICS: "true"
      SCRYER_WEB_UI_URL: http://nodejs:3000
#      SCRYER_AUTH_ENABLED: "false"
#      SCRYER_BACKGROUND_LIBRARY_REFRESH: "false"
#      SCRYER_SQLITE_MAX_CONNECTIONS: "16"
      RUST_LOG: "${RUST_LOG:-info,scryer_application::app_usecase_catalog=debug,scryer_application::app_usecase_library=debug}"
      CARGO_TARGET_DIR: /cargo-target
      SCRYER_SMG_REGISTRATION_SECRET: ${SCRYER_SMG_REGISTRATION_SECRET}
      # Optional local registry override for plugin-dev work. Leave unset to use the published registry.
      SCRYER_PLUGIN_REGISTRY_PATH: ${SCRYER_PLUGIN_REGISTRY_PATH:-}
    command: >
      sh -c '
        set -eu
        cargo run --locked -p scryer --no-default-features
      '
    volumes:
      - .:/workspace
      # Only needed when SCRYER_PLUGIN_REGISTRY_PATH points at a sibling repo checkout.
      - ..:/workspace-parent:ro
      - scryer-cargo-registry:/usr/local/cargo/registry
      - scryer-cargo-git:/usr/local/cargo/git
      - scryer-config:/config
      - ./tmp/nzbdav/mnt:/mnt/nzbdav
      - ./tmp/altmount/mnt:/mnt/altmount
      - ./tmp/decypharr/mnt:/mnt/decypharr
      - ./tmp/nzbget-downloads:/nzbget-downloads
      # - ./tmp/weaver-downloads:/weaver-downloads
    ports:
      - "8080:8080"

  nodejs:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    container_name: scryer-nodejs
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./apps/scryer-web:/app
      - scryer-node_modules:/app/node_modules
    environment:
      SCRYER_GRAPHQL_URL: /graphql
      SCRYER_VITE_USE_POLLING: "true"
      SCRYER_VITE_POLL_INTERVAL_MS: "250"
    command: >
      sh -c '
        set -eu

        lockfile="package-lock.json"
        deps_stamp="node_modules/.deps-runtime-stamp"
        lock_hash="$$(sha256sum "$$lockfile" | cut -d" " -f1)"
        runtime_key="$$(node -e '"'"'const report = process.report?.getReport?.(); const libc = process.platform === "linux" ? (report?.header?.glibcVersionRuntime ? "gnu" : "musl") : "native"; process.stdout.write([process.version, process.platform, process.arch, libc].join(":"));'"'"')"
        expected_stamp="$$lock_hash:$$runtime_key"
        rolldown_check="import(\"rolldown\").then(() => process.exit(0)).catch(() => process.exit(1))"
        needs_install=0

        if [ ! -f "$$deps_stamp" ] || [ "$$expected_stamp" != "$$(cat "$$deps_stamp" 2>/dev/null || true)" ]; then
          needs_install=1
        elif ! node -e "$$rolldown_check"; then
          echo "Detected broken native frontend dependency install; rebuilding node_modules..."
          needs_install=1
        fi

        if [ "$$needs_install" = "1" ]; then
          rm -f "$$deps_stamp"
          npm ci --prefer-offline --no-audit --no-fund
          echo "$$expected_stamp" > "$$deps_stamp"
        fi

        npm run dev
      '
    # No host port — access through the proxy instead
    expose:
      - "3000"

  proxy:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: scryer-proxy
    restart: unless-stopped
    depends_on:
      - nodejs
      - scryer
    volumes:
      - ./docker/nginx-dev-proxy.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"

  seed:
    build:
      context: .
      dockerfile: docker/scryer-dev-runtime.Dockerfile
    container_name: scryer-seed
    depends_on:
      - scryer
    volumes:
      - ./tmp/xtask-seed-target/release/xtask:/usr/local/bin/xtask:ro
      - ./dev-seed.json:/seed.json:ro
    environment:
      SCRYER_URL: http://scryer:8080
    command: ["/usr/local/bin/xtask", "seed", "dev", "--file", "/seed.json"]
    restart: "no"
    profiles: ["seed"]

networks:
  default:
    name: scryer-dev

volumes:
  scryer-config:
    name: "${SCRYER_DOCKER_STACK_NAME:-scryer-dev}-scryer-config"
  scryer-node_modules:
  scryer-cargo-registry:
  scryer-cargo-git:
