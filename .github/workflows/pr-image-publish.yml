name: scryer PR image publisher

on: # zizmor: ignore[dangerous-triggers] Only current same-repo PR artifacts are used as data with a trusted Dockerfile.
  workflow_run:
    workflows: ["scryer"]
    types: [completed]

permissions:
  contents: read

jobs:
  eligible:
    name: eligible-pr-image
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.pull_requests[0].number != null }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check current PR and prepared context
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: scryer-pr-docker-context-${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" |
            jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' > /dev/null || exit 0
          # The RC publishes once its own build context is prepared; the other
          # lanes of the run need not pass.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" --jq '.jobs[]' |
            jq -e -s 'any(.name == "docker-prepare-pr-rc" and .conclusion == "success")' > /dev/null || exit 0
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" |
            jq -e --arg name "$ARTIFACT_NAME" '.artifacts | any(.name == $name and .expired == false)' > /dev/null || exit 0
          echo "ready=true" >> "$GITHUB_OUTPUT"

  docker-publish-pr-rc:
    name: docker-publish-pr-rc
    needs: [eligible]
    if: ${{ needs.eligible.outputs.ready == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download prepared PR build context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-pr-docker-context-${{ github.event.workflow_run.id }}
          path: docker-ctx
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR RC tags
        id: pr_rc_tags
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA:0:7}"
          echo "moving_tag=pr-${PR_NUMBER}-rc" >> "$GITHUB_OUTPUT"
          echo "commit_tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: pr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          tags: |
            type=raw,value=${{ steps.pr_rc_tags.outputs.moving_tag }}
            type=raw,value=${{ steps.pr_rc_tags.outputs.commit_tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max,version=v1
          sbom: true
          tags: ${{ steps.pr_meta.outputs.tags }}
          labels: ${{ steps.pr_meta.outputs.labels }}

      - name: Resolve immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${IMAGE_OWNER}/scryer" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keylessly sign immutable OCI index
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verify the identity of this trusted default-branch workflow.
      - name: Verify keyless OCI signature
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}

  oci-verify-pr-rc:
    name: verify-oci-pr-rc-trust
    needs: [docker-publish-pr-rc]
    if: ${{ needs.docker-publish-pr-rc.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Mirrors oci-verify, minus the slsa-verifier checks: the SLSA generator
      # does not support pull_request, so RC images carry buildx's own
      # provenance attestation rather than a generator-signed one.
      - name: Verify OCI signature, provenance, and SBOM
        shell: bash
        env:
          IMAGE: ${{ needs.docker-publish-pr-rc.outputs.image }}
          DIGEST: ${{ needs.docker-publish-pr-rc.outputs.digest }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          index="$(docker buildx imagetools inspect --raw "$immutable_image")"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            subject_digest="$(jq -r \
              --arg os "$os" \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest' \
              <<< "$index")"
            test -n "$subject_digest" && test "$subject_digest" != null
            attestation_digest="$(jq -r \
              --arg subject "$subject_digest" \
              '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $subject) | .digest' \
              <<< "$index")"
            test -n "$attestation_digest" && test "$attestation_digest" != null
            attestation="$(docker buildx imagetools inspect --raw "${IMAGE}@${attestation_digest}")"
            jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")' > /dev/null <<< "$attestation"
            jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and (.annotations["in-toto.io/predicate-type"] | startswith("https://slsa.dev/provenance/")))' > /dev/null <<< "$attestation"
          done

