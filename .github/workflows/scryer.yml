          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Exclude build dir from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath $env:CARGO_TARGET_DIR

      - name: Prime sccache server
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --start-server
          sccache --zero-stats

      - name: Compile Windows-only test targets
        if: ${{ github.event_name == 'pull_request' && matrix.arch == 'x86_64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=. -C target-feature=+crt-static -W linker-messages"
          if ("${{ matrix.use_lld_link }}" -eq "true") {
            $env:RUSTFLAGS = "$env:RUSTFLAGS -Clinker=lld-link"
          }
          cargo check --tests --locked --target ${{ matrix.target }} `
            -p scryer-application `
            -p scryer-infrastructure

      - name: Prepare cold release target
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:CARGO_TARGET_DIR) {
            throw "cold release target already exists: $env:CARGO_TARGET_DIR"
          }
          New-Item -ItemType Directory -Path $env:CARGO_TARGET_DIR | Out-Null
          if (Get-ChildItem -Force $env:CARGO_TARGET_DIR) {
            throw "cold release target is not empty: $env:CARGO_TARGET_DIR"
          }
          Write-Host "cold release target contents at start:"
          Get-ChildItem -Force $env:CARGO_TARGET_DIR | Format-Table

      - name: Build scryer
        id: windows-cargo-build
        shell: pwsh
        env:
          USE_CLANG_CL: ${{ matrix.use_clang_cl }}
          USE_LLD_LINK: ${{ matrix.use_lld_link }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:SCRYER_EMBED_UI_DIR = Join-Path $env:GITHUB_WORKSPACE 'scryer-web-out'
          $env:SCRYER_SMG_REGISTRATION_SECRET = "${{ secrets.SMG_REGISTRATION_SECRET }}"
          $env:SCRYER_SMG_GRAPHQL_URL = "https://smg.scryer.media/graphql"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=. -C target-feature=+crt-static -W linker-messages"
          if ($env:USE_CLANG_CL -eq "true") {
            $env:CC = "clang-cl"
            $env:CXX = "clang-cl"
          }
          if ($env:USE_LLD_LINK -eq "true") {
            $env:RUSTFLAGS = "$env:RUSTFLAGS -Clinker=lld-link"
          }
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            cargo build --timings -p scryer --bin scryer --bin scryer-tray --profile $env:SCRYER_CARGO_PROFILE --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -FilePath "${{ matrix.artifact_name }}-build.log"
            $cargoExitCode = $LASTEXITCODE
          } else {
            & python .github/scripts/build_heartbeat.py `
              --output "${{ matrix.artifact_name }}-heartbeat.log" `
              --build-log "${{ matrix.artifact_name }}-build.log" `
              --status-file "${{ matrix.artifact_name }}-build-status.json" `
              --timeout-seconds 3300 `
              -- cargo build --timings -p scryer --bin scryer --bin scryer-tray --profile $env:SCRYER_CARGO_PROFILE --locked --target ${{ matrix.target }}
            $cargoExitCode = $LASTEXITCODE
          }
          if ($cargoExitCode -ne 0) {
            exit $cargoExitCode
          }

      - name: Validate release build diagnostics
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "${{ matrix.artifact_name }}-heartbeat.log" -PathType Leaf)) {
            throw "release heartbeat log was not created"
          }
          if (-not (Test-Path "${{ matrix.artifact_name }}-build-status.json" -PathType Leaf)) {
            throw "release build status was not created"
          }
          if ("${{ steps.windows-cargo-build.outcome }}" -eq "success") {
            $timing = Get-ChildItem -Path (Join-Path $env:CARGO_TARGET_DIR "cargo-timings") -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $timing) {
              throw "successful release build did not produce Cargo timing output"
            }
          }

      - name: Verify embedded Windows manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe"
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if (-not $mt) {
            $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mt) {
            throw "mt.exe was not found; cannot verify embedded Windows manifest"
          }
          & $mt -nologo "-inputresource:$exe;#1" "-out:embedded-manifest.xml"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $manifest = Get-Content embedded-manifest.xml -Raw
          if ($manifest -notmatch '<[^>]*longPathAware\b[^>]*>\s*true\s*</[^>]*longPathAware>') {
            throw "embedded manifest does not contain longPathAware=true"
          }

      - name: Create README.txt
        shell: pwsh
        run: |
          @"
          scryer for Windows
          ==================

          Desktop Quick Start
          -------------------
          1. Double-click scryer-tray.exe.
          2. Scryer starts locally and opens http://localhost:8080.
          3. The tray menu can open, stop, restart, or exit Scryer.

          The tray keeps desktop data, logs, and runtime state in:

              %LOCALAPPDATA%\ScryerMedia\Scryer

          It uses the ScryerMedia.Scryer.Desktop.v1 Credential Manager namespace.
          It never reads or changes legacy portable Scryer data.

          Command-Line Use
          ----------------
          scryer.exe remains available for terminals and automation. It uses its
          existing default data directory unless you pass --data-dir:

              scryer.exe --data-dir C:\scryer-data

          Unsigned Windows Build
          ----------------------
          These files are deliberately unsigned. Windows may show a browser download
          warning, a SmartScreen "More info" prompt, and an "Unknown publisher" UAC
          prompt for the MSI. Verify the SHA-256 checksum and GitHub build provenance
          published with the release before proceeding.

          Encryption Key
          --------------
          Scryer encrypts passwords and API keys stored in its database.
          On first run an encryption key is auto-generated and stored
          securely by Windows. No manual key management is needed.

          To override the key (advanced), set the environment variable
          SCRYER_ENCRYPTION_KEY before starting scryer.

          Long Paths
          ----------
          scryer.exe is long-path-aware. Windows must also have long paths
          enabled system-wide (LongPathsEnabled=1) for paths beyond the
          legacy 260-character limit to work reliably.

          Environment Variables
          ---------------------
          SCRYER_MOVIES_PATH      Movies directory
          SCRYER_SERIES_PATH      Series directory
          SCRYER_BIND             Listen address (default: 127.0.0.1:8080)
          SCRYER_OPEN_BROWSER     Set to "false" to disable auto-open
          SCRYER_DB_PATH          Override database path (advanced)
          "@ | Set-Content -Path README.txt -Encoding UTF8

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "${{ matrix.artifact_name }}-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item `
            "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe", `
            "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer-tray.exe", `
            LICENSE, README.txt `
            -Destination $stage -Force
          Compress-Archive -Path "$stage\*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Install WiX v4
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolPath = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $toolPath wix --version 4.0.5
          $toolPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Package unsigned MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "scryer" } | Select-Object -First 1).version
          .\packaging\windows\build-msi.ps1 `
            -Architecture ${{ matrix.arch }} `
            -StageDir "${{ matrix.artifact_name }}-stage" `
            -Version $version `
            -OutputPath "${{ matrix.artifact_name }}.msi"

      - name: Validate packaged Windows artifact
        shell: pwsh
        run: |
          .\.github\scripts\validate-windows-package.ps1 `
            -Architecture ${{ matrix.arch }} `
            -ZipPath "${{ matrix.artifact_name }}.zip" `
            -MsiPath "${{ matrix.artifact_name }}.msi" `
            -MsiMetadataPath "${{ matrix.artifact_name }}.msi.json" `
            -BuiltExePath "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe" `
            -BuiltTrayPath "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer-tray.exe"

      - name: Show sccache stats
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats | Tee-Object -FilePath "${{ matrix.artifact_name }}-sccache-stats.txt"
          } else {
            "sccache not installed; skipping stats" | Tee-Object -FilePath "${{ matrix.artifact_name }}-sccache-stats.txt"
          }

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.msi
            ${{ matrix.artifact_name }}.msi.json
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-defender-scan.log
            ${{ matrix.artifact_name }}-attachment-services.log
            ${{ matrix.artifact_name }}-noarg-startup.log
            ${{ matrix.artifact_name }}-winget-install.log
            ${{ matrix.artifact_name }}-msi-install.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
            ${{ matrix.artifact_name }}-heartbeat.log
            ${{ matrix.artifact_name }}-build-status.json
            ${{ github.event_name == 'pull_request' && format('{0}/target/cargo-timings/*', github.workspace) || format('{0}/{1}/cargo-timings/*', runner.temp, env.COLD_TARGET_NAME) }}
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.windows-sccache-restore.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}\.sccache
          key: ${{ steps.windows-sccache-restore.outputs.cache-primary-key }}

  docker-export:
    name: docker-export-${{ matrix.platform_id }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    needs: [rust-clippy, rust-nextest, launcher-build, linux-build]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_id: amd64
            runs_on: ubuntu-26.04
            platform: linux/amd64
            tar_name: scryer-linux-amd64-image.tar
            local_tag: scryer:test-amd64
          - platform_id: arm64
            runs_on: ubuntu-26.04-arm
            platform: linux/arm64
            tar_name: scryer-linux-arm64-image.tar
            local_tag: scryer:test-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build downloadable image tarball
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=docker,dest=/tmp/${{ matrix.tar_name }}
          tags: ${{ matrix.local_tag }}

      - name: Load built image
        run: docker load -i /tmp/${{ matrix.tar_name }}

      - name: Smoke test image runtime
        run: sh docker/test_image_runtime.sh ${{ matrix.local_tag }} ${{ matrix.platform }}

      - name: Upload image tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-image-linux-${{ matrix.platform_id }}-${{ github.run_id }}
          path: /tmp/${{ matrix.tar_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Add local test instructions
        run: |
          {
            echo "### Downloadable Docker image (${{ matrix.platform }})"
            echo
            echo "- Artifact: \`scryer-image-linux-${{ matrix.platform_id }}-${{ github.run_id }}\`"
            echo "- Tarball: \`${{ matrix.tar_name }}\`"
            echo "- Load: \`docker load -i ${{ matrix.tar_name }}\`"
            echo "- Run: \`docker run --rm -p 8080:8080 -v /path/to/scryer/config:/config ${{ matrix.local_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  docker-publish-pr-rc:
    name: docker-publish-pr-rc
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [rust-clippy, rust-nextest, launcher-build, linux-build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR RC tags
        id: pr_rc_tags
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          echo "moving_tag=pr-${PR_NUMBER}-rc" >> "$GITHUB_OUTPUT"
          echo "commit_tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: pr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          tags: |
            type=raw,value=${{ steps.pr_rc_tags.outputs.moving_tag }}
            type=raw,value=${{ steps.pr_rc_tags.outputs.commit_tag }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.pr_meta.outputs.tags }}
          labels: ${{ steps.pr_meta.outputs.labels }}

  release-trust:
    name: verify-release-trust
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify trusted SSH tag signature and release branch ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            scryer-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          release_branch="release-${RELEASE_TAG#scryer-v}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signing/allowed_signers"
          git verify-tag "$RELEASE_TAG"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          tag_target="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_target" "origin/$release_branch"; then
            echo "$RELEASE_TAG is not reachable from origin/$release_branch" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$tag_target"; then
            echo "$release_branch must be created from the current origin/main before release" >&2
            exit 1
          fi

  docker-publish:
    name: docker-publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, rust-clippy, rust-nextest, launcher-build, linux-build]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve docker release-line tag
        id: docker_release_line
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.ref_name }}"
          if [[ ! "$RELEASE_TAG" =~ ^scryer-v0\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          LINE_TAG="${BASH_REMATCH[1]}-latest"
          echo "line_tag=${LINE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.docker_release_line.outputs.line_tag }}
            type=sha
            type=match,pattern=scryer-v(.*),group=1

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max,version=1
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${{ github.repository_owner }}/scryer" >> "$GITHUB_OUTPUT"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v2.2.3

      - name: Keylessly sign immutable OCI index
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

      - name: Verify keyless OCI signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}

  container-provenance:
    name: container-slsa-provenance
    needs: [docker-publish]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-publish.outputs.image }}
      digest: ${{ needs.docker-publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  oci-verify:
    name: verify-oci-release-trust
    needs: [docker-publish, container-provenance]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v2.2.3

      - name: Install SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify OCI signature, provenance, and SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.docker-publish.outputs.image }}
          DIGEST: ${{ needs.docker-publish.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          slsa-verifier verify-image "$immutable_image" \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}"
          cosign download sbom "$immutable_image" > /dev/null

  release:
    name: publish-release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, rust-clippy, rust-nextest, linux-build, macos-build, windows-build, oci-verify, archive-provenance]
    environment:
      name: release-credentials
    permissions:
      contents: write
      id-token: write
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - name: Resolve release tag
        id: release_meta
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          ref: ${{ steps.release_meta.outputs.tag_name }}
          fetch-depth: 1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: release-artifacts
          pattern: scryer-*-${{ github.run_id }}
          merge-multiple: true

      - name: Download SLSA archive provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: scryer-provenance.intoto.jsonl
          path: release-artifacts

      - name: Install SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify every release subject with SLSA provenance
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          slsa-verifier verify-artifact \
            --provenance-path scryer-provenance.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}" \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-winget-manifests.tar.gz

      - name: Generate deterministic checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-winget-manifests.tar.gz > scryer-checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v2.2.3

      - name: Sign and verify checksum manifest
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle scryer-checksums.txt.sigstore.json \
            scryer-checksums.txt
          cosign verify-blob \
            --bundle scryer-checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            scryer-checksums.txt

      - name: Verify release notes
        run: test -s "release-notes/${{ steps.release_meta.outputs.tag_name }}.md"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.0
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          body_path: release-notes/${{ steps.release_meta.outputs.tag_name }}.md
          files: |
            release-artifacts/scryer-*.tar.gz
            release-artifacts/scryer-*.zip
            release-artifacts/scryer-*.msi
            release-artifacts/scryer-checksums.txt
            release-artifacts/scryer-checksums.txt.sigstore.json
            release-artifacts/scryer-provenance.intoto.jsonl
          fail_on_unmatched_files: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_PUSH_TOKEN not set; skipping tap update."
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#scryer-v}"
          LINUX_X86_SHA=$(shasum -a 256 release-artifacts/scryer-linux-x86_64-portable.tar.gz | cut -d ' ' -f1)
          LINUX_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-linux-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_X86_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-x86_64-portable.tar.gz | cut -d ' ' -f1)
          REPO="${{ github.repository }}"

          mkdir -p tap/Formula
          cat > tap/Formula/scryer.rb << FORMULA
          class Scryer < Formula
            desc "Self-hosted media acquisition and management platform"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            def install_support_files
              (pkgshare/"config.env.example").write <<~EOS
                # Homebrew-managed Scryer service overrides.
                SCRYER_BIND=127.0.0.1:8686
              EOS

              (libexec/"scryer-service").write <<~SH
                #!/bin/sh
                CONFIG_FILE="#{etc}/scryer/config.env"

                if [ -f "\$CONFIG_FILE" ]; then
                  set -a
                  . "\$CONFIG_FILE"
                  set +a
                fi

                exec "#{opt_bin}/scryer" --data-dir "#{var}/scryer" "\$@"
              SH

              chmod 0755, libexec/"scryer-service"
            end

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-arm64-portable.tar.gz"
                sha256 "${DARWIN_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-x86_64-portable.tar.gz"
                sha256 "${DARWIN_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-arm64-portable.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-x86_64-portable.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "scryer"
              install_support_files

              config_dir = etc/"scryer"
              config_dir.mkpath
              (var/"scryer").mkpath
              (var/"log").mkpath
              config_file = config_dir/"config.env"
              unless config_file.exist?
                config_file.write <<~EOS
                  SCRYER_BIND=127.0.0.1:8686
                EOS
              end
            end

            def caveats
              <<~EOS
                Edit #{etc}/scryer/config.env to customize the Homebrew-managed service,
                then restart it with:
                  brew services restart scryer
              EOS
            end

            service do
              run [opt_libexec/"scryer-service"]
              keep_alive true
              log_path var/"log/scryer.log"
              error_log_path var/"log/scryer.log"
            end

            test do
              assert_match "scryer", shell_output("#{bin}/scryer --version")
            end
          end
          FORMULA

          sed -i 's/^          //' tap/Formula/scryer.rb

          git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-scryer.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/scryer.rb tap-repo/Formula/scryer.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/scryer.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
          else
            git commit -m "scryer ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Trigger marketing site rebuild
        continue-on-error: true
        env:
          WEB_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEB_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN not set; skipping site rebuild."
            exit 0
          fi
          git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
          cd web-repo
          git config user.name "github-actions[bot]"
          git config user.email "133935777+NZBMan@users.noreply.github.com"
          git commit --allow-empty -m "rebuild: ${{ github.ref_name }}"
          git push origin HEAD:main

  winget-prep:
    name: winget-prep
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, windows-build, winget-xtask-build]
    permissions:
      contents: read
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Download WinGet xtask binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: winget-tools

      - name: Prepare WinGet xtask binary
        run: chmod +x winget-tools/xtask-release

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: release-artifacts
          pattern: scryer-windows-*-${{ github.run_id }}
          merge-multiple: true

      - name: Resolve WinGet metadata
        id: winget_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#scryer-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          ./winget-tools/xtask-release ci winget \
            --version "${{ steps.winget_meta.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-date "${{ steps.winget_meta.outputs.release_date }}" \
            --artifacts-dir release-artifacts \
            --output-dir winget-manifests

      - name: Upload WinGet manifest artifact
        run: tar -C winget-manifests -czf scryer-winget-manifests.tar.gz .

      - name: Upload packaged WinGet manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: scryer-winget-manifests.tar.gz
          if-no-files-found: error
          retention-days: 30

  release-subjects:
    name: prepare-release-subjects
    needs: [release-trust, linux-build, macos-build, windows-build, winget-prep]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - name: Download release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          path: release-artifacts
          pattern: scryer-*-${{ github.run_id }}
          merge-multiple: true

      - name: Generate deterministic subject list
        id: subjects
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-winget-manifests.tar.gz > scryer-subjects.sha256
          echo "base64_subjects=$(base64 < scryer-subjects.sha256 | tr -d '\n')" >> "$GITHUB_OUTPUT"

  archive-provenance:
    name: archive-slsa-provenance
    needs: [release-subjects]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release-subjects.outputs.base64_subjects }}
      provenance-name: scryer-provenance.intoto.jsonl

  winget-published-install:
    name: winget-published-install
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    needs: [release, winget-prep]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download generated WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Install the published x64 MSI through WinGet
        shell: pwsh
        run: |
          tar -xzf winget-submission/scryer-winget-manifests.tar.gz -C winget-submission
          $version = "${{ github.ref_name }}".Replace("scryer-v", "")
          .\.github\scripts\validate-published-winget-install.ps1 `
            -ManifestRoot .\winget-submission `
            -ExpectedVersion $version

  winget-submit:
    name: winget-submit
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    needs: [winget-published-install]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: release-credentials
    steps:
      - name: Download verified WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Submit WinGet manifest pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WINGET_TOKEN is required to submit the WinGet manifest pull request." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#scryer-v}"
          BRANCH="scryer-media-scryer-${VERSION}"
          ARCHIVE="${GITHUB_WORKSPACE}/winget-submission/scryer-winget-manifests.tar.gz"
          STAGING_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGING_DIR"' EXIT

          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
          MANIFEST_SOURCE="$STAGING_DIR/ScryerMedia.Scryer/$VERSION"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.locale.en-US.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.installer.yaml"

          FORK_OWNER="$(gh api user --jq .login)"
          TARGET_PATH="manifests/s/ScryerMedia/Scryer/${VERSION}"
          if gh api "repos/microsoft/winget-pkgs/contents/${TARGET_PATH}" > /dev/null 2>&1; then
            echo "ScryerMedia.Scryer ${VERSION} is already published in winget-pkgs."
            exit 0
          fi

          EXISTING_PR="$(gh pr list --repo microsoft/winget-pkgs --state open --head "${FORK_OWNER}:${BRANCH}" --json url --jq '.[0].url // empty')"
          if ! gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
            gh repo fork microsoft/winget-pkgs --clone=false
          fi
          for _ in {1..12}; do
            if gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null

          git clone --depth 1 --filter=blob:none --no-checkout --branch master \
            "https://x-access-token:${GH_TOKEN}@github.com/${FORK_OWNER}/winget-pkgs.git" winget-pkgs
          cd winget-pkgs
          git sparse-checkout init --cone
          git sparse-checkout set manifests/s/ScryerMedia/Scryer
          git checkout master
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          MANIFEST_DESTINATION="$TARGET_PATH"
          if [[ -d "$MANIFEST_DESTINATION" ]]; then
            rm -rf "$MANIFEST_DESTINATION"
          fi
          mkdir -p "$MANIFEST_DESTINATION"
          cp "$MANIFEST_SOURCE"/* "$MANIFEST_DESTINATION/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_DESTINATION"
          if ! git diff --cached --quiet; then
            git commit -m "Add ScryerMedia.Scryer version ${VERSION}"
            git push origin "$BRANCH"
          fi
          if [[ -z "$EXISTING_PR" ]]; then
            gh pr create \
              --repo microsoft/winget-pkgs \
              --base master \
              --head "${FORK_OWNER}:${BRANCH}" \
              --title "New version: ScryerMedia.Scryer version ${VERSION}" \
              --body "Automated manifest submission for [ScryerMedia.Scryer ${VERSION}](https://github.com/scryer-media/scryer/releases/tag/scryer-v${VERSION})."
          else
            echo "Updated WinGet submission awaiting review: $EXISTING_PR"
          fi
