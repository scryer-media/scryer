      - name: Package tarball
        run: tar -czf ${{ matrix.archive_name }} -C "$CARGO_TARGET_DIR/${{ matrix.target }}/$SCRYER_CARGO_PROFILE" scryer

      - name: Show sccache stats
        if: ${{ always() && github.event_name == 'pull_request' }}
