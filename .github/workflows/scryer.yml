name: scryer

on:
  pull_request:
  push:
    tags:
      - "scryer-v*"

concurrency:
  group: scryer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      web: ${{ steps.classify.outputs.web }}
      full: ${{ steps.classify.outputs.full }}
      xtask: ${{ steps.classify.outputs.xtask }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test changed-path classifier
        run: python3 .github/scripts/test_classify_scryer_ci_paths.py

      - name: Classify validation scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            scope="$(git diff --name-only --no-renames -z "$PR_BASE_SHA" "$PR_HEAD_SHA" | python3 .github/scripts/classify_scryer_ci_paths.py)"
            run_xtask="$(git diff --name-only --no-renames -z "$PR_BASE_SHA" "$PR_HEAD_SHA" | python3 .github/scripts/classify_scryer_ci_paths.py --output xtask)"
          else
            scope=full
            run_xtask=true
          fi

          case "$scope" in
            none)
              run_web=false
              run_full=false
              ;;
            web)
              run_web=true
              run_full=false
              ;;
            full)
              run_web=true
              run_full=true
              ;;
            *)
              echo "unexpected Scryer CI validation scope: $scope" >&2
              exit 1
              ;;
          esac

          echo "Scryer CI validation scope: $scope"

          {
            echo "scope=$scope"
            echo "web=$run_web"
            echo "full=$run_full"
            echo "xtask=$run_xtask"
          } >> "$GITHUB_OUTPUT"

  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/scryer-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/scryer-web
        run: npm ci

      - name: Lint
        working-directory: apps/scryer-web
        run: npm run lint

      - name: Run web unit tests
        working-directory: apps/scryer-web
        run: npm run test

      - name: Build web app
        working-directory: apps/scryer-web
        env:
          SCRYER_GRAPHQL_URL: /graphql
          SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: npm run build

      - name: Verify static output
        run: test -f apps/scryer-web/dist/index.html

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: apps/scryer-web/dist
          if-no-files-found: error
          retention-days: 14

  builtins-provenance:
    name: builtins-provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [changes, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Install provenance verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends b3sum zstd

      - name: Materialize verified pinned built-ins
        shell: bash
        run: python3 scripts/materialize-builtins.py --repo-root "$GITHUB_WORKSPACE"

      - name: Upload verified built-ins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-builtins-${{ github.run_id }}
          path: crates/scryer-plugins/builtins
          if-no-files-found: error
          retention-days: 14

  winget-xtask-build:
    name: winget-xtask-build
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [release-trust, builtins-provenance]
    permissions:
      contents: read
    if: ${{ always() && github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') && needs.release-trust.result == 'success' && needs.builtins-provenance.result == 'success' }}
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/download-builtins
        with:
          run-id: ${{ github.run_id }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure trusted tag sccache
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/x86_64-unknown-linux-gnu/

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build WinGet xtask binary
        run: cargo build --locked -p xtask-release

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee winget-xtask-sccache-stats.txt
          else
            echo "sccache not installed; skipping stats" | tee winget-xtask-sccache-stats.txt
          fi

      - name: Upload WinGet xtask binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: target/debug/xtask-release
          if-no-files-found: error
          retention-days: 14

      - name: Upload WinGet sccache stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-xtask-sccache-stats-${{ github.run_id }}
          path: winget-xtask-sccache-stats.txt
          if-no-files-found: warn
          retention-days: 14

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [changes, web, builtins-provenance, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/download-builtins
        with:
          run-id: ${{ github.run_id }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure trusted internal PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/x86_64-unknown-linux-musl/

      - name: Configure fork PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add Rust targets
        run: rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Show starting disk usage
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-start.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-clippy-disk-start.txt || true

      - name: Verify Wasmtime runtime feature surface
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p scryer-plugins -e features --locked | tee wasmtime-feature-tree.txt
          if ! grep -Fq 'wasmtime-environ feature "threads"' wasmtime-feature-tree.txt; then
            echo "required Wasmtime threads runtime support is not enabled" >&2
            exit 1
          fi
          if grep -Eq 'wasmtime feature "(gc|gc-null|wat)"' wasmtime-feature-tree.txt; then
            echo "forbidden Wasmtime runtime feature was enabled" >&2
            exit 1
          fi

      - name: Run clippy for production binary packages
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          if [ "${SCRYER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export CC_x86_64_unknown_linux_musl="sccache musl-gcc"
          else
            export CC_x86_64_unknown_linux_musl="musl-gcc"
          fi
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          cargo clippy --target x86_64-unknown-linux-musl --locked \
            -p scryer \
            -p scryer-application \
            -p scryer-domain \
            -p scryer-infrastructure-sql \
            -p scryer-infrastructure-crypto \
            -p scryer-infrastructure-library \
            -p scryer-infrastructure-library-search \
            -p scryer-infrastructure-workflow \
            -p scryer-infrastructure-acquisition \
            -p scryer-infrastructure-metadata \
            -p scryer-infrastructure-configuration \
            -p scryer-infrastructure-identity \
            -p scryer-infrastructure-notifications \
            -p scryer-infrastructure-datastore \
            -p scryer-infrastructure-runtime \
            -p scryer-interface \
            -p scryer-interface-acquisition \
            -p scryer-interface-core \
            -p scryer-interface-import \
            -p scryer-interface-media \
            -p scryer-interface-metadata \
            -p scryer-interface-query \
            -p scryer-interface-security \
            -p scryer-interface-settings \
            -p scryer-interface-subscription \
            -p scryer-interface-system \
            -p scryer-mediainfo \
            -p scryer-plugins \
            -p scryer-release-parser \
            -p scryer-rules \
            -- -D warnings 2>&1 | tee rust-clippy.log

      - name: Show ending disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-end.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-clippy-disk-end.txt || true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee rust-clippy-sccache-stats.txt

      - name: Upload rust-clippy artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-clippy-${{ github.run_id }}
          path: |
            rust-clippy.log
            rust-clippy-disk-start.txt
            rust-clippy-disk-end.txt
            rust-clippy-sccache-stats.txt
            wasmtime-feature-tree.txt
          if-no-files-found: error
          retention-days: 14

  rust-nextest:
    name: rust-nextest
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [changes, web, builtins-provenance, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/download-builtins
        with:
          run-id: ${{ github.run_id }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Configure trusted internal PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/x86_64-unknown-linux-gnu/

      - name: Configure fork PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends mold nasm

      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: nextest

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Show starting disk usage
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-start.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-nextest-disk-start.txt || true

      - name: Run full-feature Scryer tests
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          export RUST_MIN_STACK="4194304"
          cargo nextest run --locked \
            --workspace \
            --exclude xtask \
            --exclude xtask-release \
            --exclude xtask-migrations \
            --exclude xtask-support \
            --exclude xtask-trash-guides \
            --all-features \
            --no-fail-fast 2>&1 | tee rust-nextest.log

      - name: Show ending disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-end.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-nextest-disk-end.txt || true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee rust-nextest-sccache-stats.txt

      - name: Upload rust-nextest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-nextest-${{ github.run_id }}
          path: |
            rust-nextest.log
            rust-nextest-disk-start.txt
            rust-nextest-disk-end.txt
            rust-nextest-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

  launcher-build:
    name: launcher-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    needs: [changes, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            sccache_lane: launcher-linux-x86_64-musl
            sccache_writer_id: launcher-linux-amd64
            artifact_name: launcher-linux-amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            sccache_lane: launcher-linux-arm64-musl
            sccache_writer_id: launcher-linux-arm64
            artifact_name: launcher-linux-arm64
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TARGET_NAME: scryer-launcher-${{ matrix.arch }}
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure build target
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${RELEASE_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve sccache lane metadata
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        id: launcher-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        id: launcher-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ matrix.sccache_writer_id }}-${{ github.run_id }}
          restore-keys: |
