          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Configure trusted tag sccache
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Prepare clean local release target
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$CARGO_TARGET_DIR" ]; then
            echo "clean local release target already exists: $CARGO_TARGET_DIR" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          test -z "$(ls -A "$CARGO_TARGET_DIR")"
          echo "clean local release target contents at start:"
          ls -la "$CARGO_TARGET_DIR"

      - name: Build scryer
        id: linux-cargo-build
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_BUILD_LANE="${{ matrix.build_lane }}"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          target_env_suffix="$(printf '%s' "${{ matrix.target }}" | tr '-' '_')"
          target_cc_var="CC_${target_env_suffix}"
          target_cflags_var="CFLAGS_${target_env_suffix}"
          target_cxxflags_var="CXXFLAGS_${target_env_suffix}"
          if [ "${SCRYER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export "${target_cc_var}=sccache musl-gcc"
          else
            export "${target_cc_var}=musl-gcc"
          fi
          native_flags="-O3 -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden"
          export "${target_cflags_var}=${native_flags}"
          export "${target_cxxflags_var}=${native_flags}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          {
            musl-gcc --version
            printf '%s=%s\n' "${target_cc_var}" "${!target_cc_var}"
            printf '%s=%s\n' "${target_cflags_var}" "${!target_cflags_var}"
            printf '%s=%s\n' "${target_cxxflags_var}" "${!target_cxxflags_var}"
            printf 'AWS_LC_SYS_USE_SYSTEM=%s\n' "${AWS_LC_SYS_USE_SYSTEM}"
            printf 'AWS_LC_SYS_STATIC=%s\n' "${AWS_LC_SYS_STATIC}"
            printf 'AWS_LC_SYS_SMALL=%s\n' "${AWS_LC_SYS_SMALL}"
            printf 'AWS_LC_SYS_CMAKE_BUILDER=%s\n' "${AWS_LC_SYS_CMAKE_BUILDER}"
