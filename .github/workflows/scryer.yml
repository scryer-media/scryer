    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure build target
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${COLD_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          packages=(musl-tools mold)
          if [[ "${{ matrix.install_nasm }}" == "true" ]]; then
            packages+=(nasm)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Restore sccache directory
        if: ${{ github.event_name == 'pull_request' }}
        id: linux-sccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
