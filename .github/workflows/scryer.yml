name: scryer

on:
  pull_request:
  push:
    tags:
      - "scryer-v*"

concurrency:
  group: scryer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_WARNINGS: deny
  SCRYER_SCCACHE_PUBLISH_SHARED: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') && 'true' || 'false' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/scryer-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/scryer-web
        run: npm ci

      - name: Lint
        working-directory: apps/scryer-web
        run: npm run lint

      - name: Run web unit tests
        working-directory: apps/scryer-web
        run: npm run test

      - name: Build web app
        working-directory: apps/scryer-web
        env:
          SCRYER_GRAPHQL_URL: /graphql
          SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: npm run build

      - name: Verify static output
        run: test -f apps/scryer-web/dist/index.html

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: apps/scryer-web/dist
          if-no-files-found: error
          retention-days: 14

  winget-xtask-build:
    name: winget-xtask-build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"

      - name: Build WinGet xtask binary
        run: cargo build --locked -p xtask-release

      - name: Upload WinGet xtask binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: target/debug/xtask-release
          if-no-files-found: error
          retention-days: 14

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [web]
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Resolve sccache lane metadata
        id: rust-clippy-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        id: rust-clippy-sccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-clippy-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-rust-clippy-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-clippy-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-clippy-sccache-metadata.outputs.version_line }}-
            gha-sccache-v3-rust-check-linux-x86_64-musl-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Show starting disk usage
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-start.txt
          du -sh target "$CARGO_HOME" "$SCCACHE_DIR" 2>/dev/null | tee -a rust-clippy-disk-start.txt || true

      - name: Verify Wasmtime runtime feature surface
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p scryer-plugins -e features --locked | tee wasmtime-feature-tree.txt
          if ! grep -Fq 'wasmtime feature "threads"' wasmtime-feature-tree.txt; then
            echo "required Wasmtime threads feature is not enabled" >&2
            exit 1
          fi
          if grep -Eq 'wasmtime feature "(gc|gc-null|wat)"' wasmtime-feature-tree.txt; then
            echo "forbidden Wasmtime runtime feature was enabled" >&2
            exit 1
          fi

      - name: Run clippy for production binary packages
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export CC_x86_64_unknown_linux_musl="sccache musl-gcc"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          cargo clippy --target x86_64-unknown-linux-musl --locked \
            -p scryer \
            -p scryer-application \
            -p scryer-domain \
            -p scryer-infrastructure \
            -p scryer-interface \
            -p scryer-interface-acquisition \
            -p scryer-interface-core \
            -p scryer-interface-import \
            -p scryer-interface-media \
            -p scryer-interface-metadata \
            -p scryer-interface-query \
            -p scryer-interface-security \
            -p scryer-interface-settings \
            -p scryer-interface-subscription \
            -p scryer-interface-system \
            -p scryer-mediainfo \
            -p scryer-plugins \
            -p scryer-release-parser \
            -p scryer-rules \
            -- -D warnings 2>&1 | tee rust-clippy.log

      - name: Show ending disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-end.txt
          du -sh target "$CARGO_HOME" "$SCCACHE_DIR" 2>/dev/null | tee -a rust-clippy-disk-end.txt || true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee rust-clippy-sccache-stats.txt
          else
            echo "sccache not installed; skipping stats" | tee rust-clippy-sccache-stats.txt
          fi

      - name: Upload rust-clippy artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-clippy-${{ github.run_id }}
          path: |
            rust-clippy.log
            rust-clippy-disk-start.txt
            rust-clippy-disk-end.txt
            rust-clippy-sccache-stats.txt
            wasmtime-feature-tree.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always() && (env.SCRYER_SCCACHE_PUBLISH_SHARED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && steps.rust-clippy-sccache-restore.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.rust-clippy-sccache-restore.outputs.cache-primary-key }}

  rust-nextest:
    name: rust-nextest
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [web]
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Resolve sccache lane metadata
        id: rust-nextest-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        id: rust-nextest-sccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-nextest-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-rust-nextest-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-nextest-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v3-rust-check-linux-x86_64-musl-${{ steps.rust-nextest-sccache-metadata.outputs.version_line }}-
            gha-sccache-v3-rust-check-linux-x86_64-musl-

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: nextest

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out

      - name: Prime sccache server
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Show starting disk usage
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-start.txt
          du -sh target "$CARGO_HOME" "$SCCACHE_DIR" 2>/dev/null | tee -a rust-nextest-disk-start.txt || true

      - name: Run full-feature workspace tests
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export CC_x86_64_unknown_linux_musl="sccache musl-gcc"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          export RUST_MIN_STACK="4194304"
          cargo nextest run --target x86_64-unknown-linux-musl --locked \
            --workspace \
            --all-features \
            --no-fail-fast 2>&1 | tee rust-nextest.log

      - name: Show ending disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-end.txt
          du -sh target "$CARGO_HOME" "$SCCACHE_DIR" 2>/dev/null | tee -a rust-nextest-disk-end.txt || true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee rust-nextest-sccache-stats.txt
          else
            echo "sccache not installed; skipping stats" | tee rust-nextest-sccache-stats.txt
          fi

      - name: Upload rust-nextest artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-nextest-${{ github.run_id }}
          path: |
            rust-nextest.log
            rust-nextest-disk-start.txt
            rust-nextest-disk-end.txt
            rust-nextest-sccache-stats.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save sccache directory
        if: always() && (env.SCRYER_SCCACHE_PUBLISH_SHARED == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && steps.rust-nextest-sccache-restore.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/sccache
          key: ${{ steps.rust-nextest-sccache-restore.outputs.cache-primary-key }}

  launcher-build:
    name: launcher-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            sccache_lane: launcher-linux-x86_64-musl
            sccache_writer_id: launcher-linux-amd64
            artifact_name: launcher-linux-amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            sccache_lane: launcher-linux-arm64-musl
            sccache_writer_id: launcher-linux-arm64
            artifact_name: launcher-linux-arm64
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      COLD_TARGET_NAME: scryer-launcher-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure build target
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${COLD_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.97.1"

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends musl-tools mold

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Resolve sccache lane metadata
        if: ${{ github.event_name == 'pull_request' }}
        id: launcher-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        if: ${{ github.event_name == 'pull_request' }}
        id: launcher-sccache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ matrix.sccache_writer_id }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-

      - name: Install sccache
        if: ${{ github.event_name == 'pull_request' }}
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Configure sccache
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCCACHE_BASEDIRS=${GITHUB_WORKSPACE}"
            echo "SCCACHE_CACHE_SIZE=10G"
            echo "SCCACHE_DIR=/home/runner/.cache/sccache"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"

      - name: Prime sccache server
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Run launcher tests (PR fast feedback; tags use workspace nextest)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p scryer-launcher --locked 2>&1 | tee "${{ matrix.artifact_name }}-test.log"

      - name: Prepare cold release target
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$CARGO_TARGET_DIR" ]; then
            echo "cold release target already exists: $CARGO_TARGET_DIR" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          test -z "$(ls -A "$CARGO_TARGET_DIR")"
          echo "cold release target contents at start:"
          ls -la "$CARGO_TARGET_DIR"

      - name: Build launcher
        id: launcher-cargo-build
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            cargo build --timings -p scryer-launcher --profile release-launcher --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"
          else
            python3 .github/scripts/build_heartbeat.py \
              --output "${{ matrix.artifact_name }}-heartbeat.log" \
              --build-log "${{ matrix.artifact_name }}-build.log" \
              --status-file "${{ matrix.artifact_name }}-build-status.json" \
              --timeout-seconds 2100 \
              -- cargo build --timings -p scryer-launcher --profile release-launcher --locked --target "${{ matrix.target }}"
          fi

      - name: Validate release build diagnostics
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.artifact_name }}-heartbeat.log"
          test -s "${{ matrix.artifact_name }}-build-status.json"
          if [ "${{ steps.launcher-cargo-build.outcome }}" = "success" ]; then
            compgen -G "$CARGO_TARGET_DIR/cargo-timings/*" >/dev/null
          fi

      - name: Package launcher tarball
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C "$CARGO_TARGET_DIR/${{ matrix.target }}/release-launcher" scryer-launcher

      - name: Show sccache stats
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          else
            echo "sccache not installed; skipping stats" | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          fi

      - name: Upload launcher artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
