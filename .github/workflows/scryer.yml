name: scryer

on:
  pull_request:
  push:
    tags:
      - "scryer-v*"

concurrency:
  group: scryer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      web: ${{ steps.classify.outputs.web }}
      full: ${{ steps.classify.outputs.full }}
      xtask: ${{ steps.classify.outputs.xtask }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test change classification and required-check gates
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*ci*.py'

      - name: Classify validation scope
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            scope="$(git diff --name-only --no-renames -z "$PR_BASE_SHA" "$PR_HEAD_SHA" | python3 .github/scripts/classify_scryer_ci_paths.py)"
            run_xtask="$(git diff --name-only --no-renames -z "$PR_BASE_SHA" "$PR_HEAD_SHA" | python3 .github/scripts/classify_scryer_ci_paths.py --output xtask)"
          else
            scope=full
            run_xtask=true
          fi

          case "$scope" in
            none)
              run_web=false
              run_full=false
              ;;
            web)
              run_web=true
              run_full=false
              ;;
            full)
              run_web=true
              run_full=true
              ;;
            *)
              echo "unexpected Scryer CI validation scope: $scope" >&2
              exit 1
              ;;
          esac

          echo "Scryer CI validation scope: $scope"

          {
            echo "scope=$scope"
            echo "web=$run_web"
            echo "full=$run_full"
            echo "xtask=$run_xtask"
          } >> "$GITHUB_OUTPUT"

  web:
    name: web
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    needs: [changes]
    if: always()
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.web }}
          READY: ${{ needs.changes.outputs.web == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - name: Setup Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: apps/scryer-web/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/scryer-web
        run: npm ci

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/scryer-web
        run: npm run lint

      - name: Run web unit tests
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/scryer-web
        run: npm run test

      - name: Build web app
        if: steps.scope.outputs.run == 'true'
        working-directory: apps/scryer-web
        env:
          SCRYER_GRAPHQL_URL: /graphql
          SCRYER_METADATA_GATEWAY_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: npm run build

      - name: Verify static output
        if: steps.scope.outputs.run == 'true'
        run: test -f apps/scryer-web/dist/index.html

      - name: Upload web artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: apps/scryer-web/dist
          if-no-files-found: error
          retention-days: 14

  builtins-provenance:
    name: builtins-provenance
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [changes, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Cosign
        id: cosign-first
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Retry Cosign installation
        if: steps.cosign-first.outcome == 'failure'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Install provenance verification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends b3sum zstd

      - name: Materialize verified pinned built-ins
        shell: bash
        run: python3 scripts/materialize-builtins.py --repo-root "$GITHUB_WORKSPACE"

      - name: Upload verified built-ins
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scryer-builtins-${{ github.run_id }}
          path: crates/scryer-plugins/builtins
          if-no-files-found: error
          retention-days: 14

  winget-xtask-build:
    name: winget-xtask-build
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [changes, release-trust, builtins-provenance]
    permissions:
      contents: read
    if: always()
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
          READY: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') && needs.release-trust.result == 'success' && needs.builtins-provenance.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.98.1"

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure trusted tag sccache
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/x86_64-unknown-linux-gnu/

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Build WinGet xtask binary
        if: steps.scope.outputs.run == 'true'
        run: cargo build --locked -p xtask-release

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee winget-xtask-sccache-stats.txt
          else
            echo "sccache not installed; skipping stats" | tee winget-xtask-sccache-stats.txt
          fi

      - name: Upload WinGet xtask binary
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: target/debug/xtask-release
          if-no-files-found: error
          retention-days: 14

      - name: Upload WinGet sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-xtask-sccache-stats-${{ github.run_id }}
          path: winget-xtask-sccache-stats.txt
          if-no-files-found: warn
          retention-days: 14

  rust-clippy:
    name: rust-clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [changes, web, builtins-provenance, release-trust]
    if: always()
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/x86_64-unknown-linux-musl/

      - name: Configure fork PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Install system dependencies
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends musl-tools mold nasm

      - name: Add Rust targets
        if: steps.scope.outputs.run == 'true'
        run: rustup target add x86_64-unknown-linux-musl wasm32-wasip2

      - name: Download embedded web artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Show starting disk usage
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-start.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-clippy-disk-start.txt || true

      - name: Verify Wasmtime runtime feature surface
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo tree -p scryer-plugins -e features --locked | tee wasmtime-feature-tree.txt
          if ! grep -Fq 'wasmtime-environ feature "threads"' wasmtime-feature-tree.txt; then
            echo "required Wasmtime threads runtime support is not enabled" >&2
            exit 1
          fi
          if grep -Eq 'wasmtime feature "(gc|gc-null|wat)"' wasmtime-feature-tree.txt; then
            echo "forbidden Wasmtime runtime feature was enabled" >&2
            exit 1
          fi

      - name: Run clippy for production binary packages
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          if [ "${SCRYER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export CC_x86_64_unknown_linux_musl="sccache musl-gcc"
          else
            export CC_x86_64_unknown_linux_musl="musl-gcc"
          fi
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          cargo clippy --target x86_64-unknown-linux-musl --locked \
            -p scryer \
            -p scryer-application \
            -p scryer-domain \
            -p scryer-infrastructure-sql \
            -p scryer-infrastructure-crypto \
            -p scryer-infrastructure-library \
            -p scryer-infrastructure-library-search \
            -p scryer-infrastructure-workflow \
            -p scryer-infrastructure-acquisition \
            -p scryer-infrastructure-metadata \
            -p scryer-infrastructure-configuration \
            -p scryer-infrastructure-identity \
            -p scryer-infrastructure-notifications \
            -p scryer-infrastructure-datastore \
            -p scryer-infrastructure-runtime \
            -p scryer-interface \
            -p scryer-interface-acquisition \
            -p scryer-interface-core \
            -p scryer-interface-import \
            -p scryer-interface-media \
            -p scryer-interface-metadata \
            -p scryer-interface-query \
            -p scryer-interface-security \
            -p scryer-interface-settings \
            -p scryer-interface-subscription \
            -p scryer-interface-system \
            -p scryer-mediainfo \
            -p scryer-outbound-http \
            -p scryer-plugins \
            -p scryer-release-parser \
            -p scryer-rules \
            -- -D warnings 2>&1 | tee rust-clippy.log

      - name: Show ending disk usage
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-clippy-disk-end.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-clippy-disk-end.txt || true

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          sccache --show-stats | tee rust-clippy-sccache-stats.txt

      - name: Upload rust-clippy artifacts
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: rust-clippy-${{ github.run_id }}
          path: |
            rust-clippy.log
            rust-clippy-disk-start.txt
            rust-clippy-disk-end.txt
            rust-clippy-sccache-stats.txt
            wasmtime-feature-tree.txt

  windows-validation:
    name: windows-${{ matrix.mode }}
    runs-on: windows-2025
    timeout-minutes: 60
    needs: [changes, web, builtins-provenance, release-trust]
    if: always()
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [clippy, tests]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "4194304"
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      AWS_LC_SYS_PREBUILT_NASM: "0"
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'
      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.97.1-x86_64-pc-windows-msvc"
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.scope.outputs.run == 'true'
        with:
          version: v0.18.0
      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/x86_64-pc-windows-msvc/
      - name: Configure compiler and linker
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CC=sccache clang-cl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX=sccache clang-cl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=. -C target-feature=+crt-static -Clinker=lld-link -W linker-messages" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SCRYER_EMBED_UI_DIR=$env:GITHUB_WORKSPACE/scryer-web-out" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install pinned NASM
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip" -OutFile nasm.zip
          if ((Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4") {
            throw "NASM checksum mismatch"
          }
          $destination = Join-Path $env:RUNNER_TEMP "validation-nasm"
          Expand-Archive nasm.zip -DestinationPath $destination
          (Get-ChildItem $destination -Directory | Select-Object -First 1).FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: steps.scope.outputs.run == 'true'
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        if: ${{ steps.scope.outputs.run == 'true' && (matrix.mode == 'tests') }}
        with:
          tool: nextest
      - name: Run native Windows validation
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        env:
          VALIDATION_MODE: ${{ matrix.mode }}
          SCRYER_SMG_REGISTRATION_SECRET: ${{ secrets.SMG_REGISTRATION_SECRET }}
          SCRYER_SMG_GRAPHQL_URL: https://smg.scryer.media/graphql
        run: |
          python -B .github/scripts/windows_ci.py $env:VALIDATION_MODE 2>&1 | Tee-Object -FilePath windows-validation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record compiler cache statistics
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: pwsh
        run: sccache --show-stats | Tee-Object -FilePath windows-validation-cache.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        with:
          name: windows-${{ matrix.mode }}-validation-${{ github.run_id }}
          path: |
            windows-validation.log
            windows-validation-cache.txt
            windows-test-inventory.json
            target/cargo-timings/
          retention-days: 14

  nextest-matrix:
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.full == 'true'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.1"
      - name: Validate and generate target matrix
        id: matrix
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_nextest_matrix.py'
          python3 .github/scripts/nextest_matrix.py matrix >> "$GITHUB_OUTPUT"

  rust-nextest-target:
    name: nextest (${{ matrix.id }})
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: [changes, nextest-matrix, web, builtins-provenance, release-trust]
    if: ${{ always() && needs.changes.outputs.full == 'true' && needs.nextest-matrix.result == 'success' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.nextest-matrix.outputs.matrix) }}
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: debuginfo
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_TEST_STRIP: debuginfo
      CARGO_TERM_COLOR: always
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
      SCRYER_WASMTIME_TEST_CACHE_ROOT: /home/runner/.cache/scryer-wasmtime-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/download-builtins
        with:
          run-id: ${{ github.run_id }}

      # Compiled plugin components, shared by every test process. Scoped to the
      # pull request: this workflow has no branch pushes, so there is no
      # default-branch cache to share and the first run of a PR stays cold.
      - name: Restore Wasmtime test cache
        if: ${{ github.event_name == 'pull_request' }}
        id: wasmtime-test-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/scryer-wasmtime-test
          key: wasmtime-test-v2-${{ matrix.id }}-${{ hashFiles('Cargo.lock', 'crates/scryer-plugins/builtins/*.wasm.zst') }}
          restore-keys: |
            wasmtime-test-v2-${{ matrix.id }}-
            wasmtime-test-v1-

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.98.1"

      - name: Install sccache
        uses: ./.github/actions/install-ci-sccache

      - name: Configure trusted internal PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/x86_64-unknown-linux-gnu/

      - name: Configure fork PR sccache
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Prime sccache server
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends mold nasm

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: nextest

      - name: Download embedded web artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Show starting disk usage
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-start.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-nextest-disk-start.txt || true

      - name: Build and run selected test target
        shell: bash
        env:
          NEXTEST_LANE: ${{ matrix.id }}
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          export RUST_MIN_STACK="4194304"
          python3 .github/scripts/nextest_matrix.py run "$NEXTEST_LANE" 2>&1 | tee rust-nextest.log

      # Saved whether or not tests passed: compiled components stay valid.
      - name: Save Wasmtime test cache
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.wasmtime-test-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/scryer-wasmtime-test
          key: ${{ steps.wasmtime-test-cache.outputs.cache-primary-key }}

      - name: Show ending disk usage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          df -h | tee rust-nextest-disk-end.txt
          du -sh target "$CARGO_HOME" 2>/dev/null | tee -a rust-nextest-disk-end.txt || true

      - name: Show sccache stats
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null; then
            sccache --show-stats | tee rust-nextest-sccache-stats.txt
          else
            echo "sccache installation did not complete" | tee rust-nextest-sccache-stats.txt
          fi

      - name: Upload rust-nextest artifacts
        if: always()
        uses: ./.github/actions/upload-ci-diagnostics
        with:
          name: rust-nextest-${{ matrix.id }}-${{ github.run_id }}
          path: |
            rust-nextest.log
            rust-nextest-disk-start.txt
            rust-nextest-disk-end.txt
            rust-nextest-sccache-stats.txt
            nextest-results/
            target/cargo-timings/

  rust-nextest:
    name: rust-nextest
    runs-on: ubuntu-26.04
    needs: [changes, nextest-matrix, rust-nextest-target]
    if: always()
    steps:
      - name: Check required target results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          MATRIX_RESULT: ${{ needs.nextest-matrix.result }}
          TARGET_RESULT: ${{ needs.rust-nextest-target.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FULL" = false ]; then
            test "$MATRIX_RESULT" = skipped
            test "$TARGET_RESULT" = skipped
          else
            test "$FULL" = true
            test "$MATRIX_RESULT" = success
            test "$TARGET_RESULT" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.full == 'true'
      - name: Download target receipts
        if: needs.changes.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rust-nextest-*-${{ github.run_id }}*
          path: nextest-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error
      - name: Verify target coverage and summarize timings
        if: needs.changes.outputs.full == 'true'
        env:
          EXPECTED_MATRIX: ${{ needs.nextest-matrix.outputs.matrix }}
        run: python3 .github/scripts/nextest_matrix.py verify nextest-artifacts

  launcher-build:
    name: launcher-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    needs: [changes, release-trust]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            sccache_lane: launcher-linux-x86_64-musl
            sccache_writer_id: launcher-linux-amd64
            artifact_name: launcher-linux-amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            sccache_lane: launcher-linux-arm64-musl
            sccache_writer_id: launcher-linux-arm64
            artifact_name: launcher-linux-arm64
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TARGET_NAME: scryer-launcher-${{ matrix.arch }}
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - name: Configure build target
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${RELEASE_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.98.1"

      - name: Install system dependencies
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends musl-tools mold

      - name: Add target
        if: steps.scope.outputs.run == 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Resolve sccache lane metadata
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: launcher-sccache-metadata
        shell: bash
        run: |
          set -euo pipefail
          version_line="$(python3 - <<'PY'
          import pathlib
          import re

          cargo_toml = pathlib.Path("crates/scryer/Cargo.toml").read_text()
          match = re.search(r'^version = "(\d+)\.(\d+)\.\d+"$', cargo_toml, re.MULTILINE)
          if not match:
              raise SystemExit("failed to resolve crates/scryer/Cargo.toml version")
          print(f"{match.group(1)}.{match.group(2)}.x")
          PY
          )"
          echo "SCRYER_SCCACHE_VERSION_LINE=${version_line}" >> "$GITHUB_ENV"
          echo "version_line=${version_line}" >> "$GITHUB_OUTPUT"

      - name: Restore sccache directory
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: launcher-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ matrix.sccache_writer_id }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-${{ steps.launcher-sccache-metadata.outputs.version_line }}-
            gha-sccache-v3-${{ matrix.sccache_lane }}-release-launcher-

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Configure trusted tag sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v')) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Run launcher tests (PR fast feedback; tags use workspace nextest)
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p scryer-launcher --locked 2>&1 | tee "${{ matrix.artifact_name }}-test.log"

      - name: Prepare clean local release target
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$CARGO_TARGET_DIR" ]; then
            echo "clean local release target already exists: $CARGO_TARGET_DIR" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          test -z "$(ls -A "$CARGO_TARGET_DIR")"
          echo "clean local release target contents at start:"
          ls -la "$CARGO_TARGET_DIR"

      - name: Build launcher
        if: steps.scope.outputs.run == 'true'
        id: launcher-cargo-build
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            cargo build --timings -p scryer-launcher --profile release-launcher --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"
          else
            python3 .github/scripts/build_heartbeat.py \
              --output "${{ matrix.artifact_name }}-heartbeat.log" \
              --build-log "${{ matrix.artifact_name }}-build.log" \
              --status-file "${{ matrix.artifact_name }}-build-status.json" \
              -- cargo build --timings -p scryer-launcher --profile release-launcher --locked --target "${{ matrix.target }}"
          fi

      - name: Validate release build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always() && github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.artifact_name }}-heartbeat.log"
          test -s "${{ matrix.artifact_name }}-build-status.json"
          if [ "${{ steps.launcher-cargo-build.outcome }}" = "success" ]; then
            compgen -G "$CARGO_TARGET_DIR/cargo-timings/*" >/dev/null
          fi

      - name: Package launcher tarball
        if: steps.scope.outputs.run == 'true'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C "$CARGO_TARGET_DIR/${{ matrix.target }}/release-launcher" scryer-launcher

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          else
            echo "sccache not installed; skipping stats" | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          fi

      - name: Upload launcher artifacts
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}-test.log
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-heartbeat.log
            ${{ matrix.artifact_name }}-build-status.json
            ${{ matrix.artifact_name }}-sccache-stats.txt
            ${{ github.event_name == 'pull_request' && format('{0}/target/cargo-timings/*', github.workspace) || format('{0}/{1}/cargo-timings/*', runner.temp, env.RELEASE_TARGET_NAME) }}
          if-no-files-found: error
          retention-days: 14

  linux-build:
    name: linux-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ github.event_name == 'pull_request' && matrix.runner || matrix.release_runner }}
    timeout-minutes: 90
    needs: [changes, web, builtins-provenance, release-trust]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            variant: portable
            build_lane: portable
            runner: ubuntu-24.04
            release_runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            sccache_lane: pr-linux-x86_64-cpu
            artifact_name: scryer-linux-x86_64-portable
            archive_name: scryer-linux-x86_64-portable.tar.gz
            release_profile: release
            install_nasm: true
            extra_rustflags: ""
          - arch: arm64
            variant: portable
            build_lane: portable
            runner: ubuntu-26.04-arm
            release_runner: linux_arm_release
            target: aarch64-unknown-linux-musl
            sccache_lane: pr-linux-arm64-cpu
            artifact_name: scryer-linux-arm64-portable
            archive_name: scryer-linux-arm64-portable.tar.gz
            release_profile: release
            install_nasm: false
            extra_rustflags: ""
    env:
      CARGO_HOME: /home/runner/.cargo
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TARGET_NAME: scryer-linux-${{ matrix.arch }}-${{ matrix.variant }}
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      SCRYER_CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'rc' || matrix.release_profile }}
      SCCACHE_BASEDIRS: /home/runner/work/scryer/scryer
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}

      - name: Configure build target
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${RELEASE_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.98.1"

      - name: Install system dependencies
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=(musl-tools mold)
          if [[ "${{ matrix.install_nasm }}" == "true" ]]; then
            packages+=(nasm)
          fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Add target
        if: steps.scope.outputs.run == 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Restore sccache directory
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: linux-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/sccache
          key: gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Configure trusted tag sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v')) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Download embedded web artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        run: |
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Prepare clean local release target
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$CARGO_TARGET_DIR" ]; then
            echo "clean local release target already exists: $CARGO_TARGET_DIR" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          test -z "$(ls -A "$CARGO_TARGET_DIR")"
          echo "clean local release target contents at start:"
          ls -la "$CARGO_TARGET_DIR"

      - name: Build scryer
        if: steps.scope.outputs.run == 'true'
        id: linux-cargo-build
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_BUILD_LANE="${{ matrix.build_lane }}"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          target_env_suffix="$(printf '%s' "${{ matrix.target }}" | tr '-' '_')"
          target_cc_var="CC_${target_env_suffix}"
          target_cflags_var="CFLAGS_${target_env_suffix}"
          target_cxxflags_var="CXXFLAGS_${target_env_suffix}"
          if [ "${SCRYER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export "${target_cc_var}=sccache musl-gcc"
          else
            export "${target_cc_var}=musl-gcc"
          fi
          native_flags="-O3 -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden"
          export "${target_cflags_var}=${native_flags}"
          export "${target_cxxflags_var}=${native_flags}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -C link-arg=-fuse-ld=mold -W linker-messages"
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          {
            musl-gcc --version
            printf '%s=%s\n' "${target_cc_var}" "${!target_cc_var}"
            printf '%s=%s\n' "${target_cflags_var}" "${!target_cflags_var}"
            printf '%s=%s\n' "${target_cxxflags_var}" "${!target_cxxflags_var}"
            printf 'AWS_LC_SYS_USE_SYSTEM=%s\n' "${AWS_LC_SYS_USE_SYSTEM}"
            printf 'AWS_LC_SYS_STATIC=%s\n' "${AWS_LC_SYS_STATIC}"
            printf 'AWS_LC_SYS_SMALL=%s\n' "${AWS_LC_SYS_SMALL}"
            printf 'AWS_LC_SYS_CMAKE_BUILDER=%s\n' "${AWS_LC_SYS_CMAKE_BUILDER}"
          } | tee "${{ matrix.artifact_name }}-native-build-env.txt"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            cargo build --timings -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"
          else
            python3 .github/scripts/build_heartbeat.py \
              --output "${{ matrix.artifact_name }}-heartbeat.log" \
              --build-log "${{ matrix.artifact_name }}-build.log" \
              --status-file "${{ matrix.artifact_name }}-build-status.json" \
              --interval-seconds "${{ matrix.arch == 'arm64' && '1' || '60' }}" \
              -- cargo build --timings -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}"
          fi

      - name: Validate native linkage
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/$SCRYER_CARGO_PROFILE/scryer"
          readelf -d "$binary" | tee "${{ matrix.artifact_name }}-native-linkage.txt"
          if grep -q '(NEEDED)' "${{ matrix.artifact_name }}-native-linkage.txt"; then
            echo "::error::Linux release binary has dynamic NEEDED libraries"
            exit 1
          fi

      - name: Validate release build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always() && github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.artifact_name }}-heartbeat.log"
          test -s "${{ matrix.artifact_name }}-build-status.json"
          if [ "${{ steps.linux-cargo-build.outcome }}" = "success" ]; then
            compgen -G "$CARGO_TARGET_DIR/cargo-timings/*" >/dev/null
            build_log="${{ matrix.artifact_name }}-build.log"
            if grep -Eq 'aws-lc-sys@[^:]+: (Building with: System Library|Size-optimized AWS-LC build enabled)' "$build_log"; then
              echo "::error::Release build log reports an unsupported AWS-LC build mode"
              exit 1
            fi
          fi

      - name: Package tarball
        if: steps.scope.outputs.run == 'true'
        run: tar -czf ${{ matrix.archive_name }} -C "$CARGO_TARGET_DIR/${{ matrix.target }}/$SCRYER_CARGO_PROFILE" scryer

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          else
            echo "sccache not installed; skipping stats" | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          fi

      - name: Upload release package
        if: ${{ steps.scope.outputs.run == 'true' && (success()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics-${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-heartbeat.log
            ${{ matrix.artifact_name }}-build-status.json
            ${{ matrix.artifact_name }}-native-build-env.txt
            ${{ matrix.artifact_name }}-native-linkage.txt
            ${{ matrix.artifact_name }}-sccache-stats.txt
            ${{ github.event_name == 'pull_request' && format('{0}/target/cargo-timings/*', github.workspace) || format('{0}/{1}/cargo-timings/*', runner.temp, env.RELEASE_TARGET_NAME) }}
          if-no-files-found: warn
          retention-days: 14

  macos-build:
    name: macos-${{ matrix.arch }}-${{ matrix.variant }}
    runs-on: ${{ github.event_name == 'pull_request' && matrix.runner || matrix.release_runner }}
    timeout-minutes: 120
    needs: [changes, web, builtins-provenance, release-trust]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            variant: portable
            build_lane: portable
            runner: macos-15
            release_runner: macos-15
            target: aarch64-apple-darwin
            sccache_lane: scryer-macos-arm64
            sccache_writer_id: scryer-darwin-arm64-portable
            artifact_name: scryer-darwin-arm64-portable
            release_profile: release
            install_nasm: false
            extra_rustflags: ""
          - arch: x86_64
            variant: portable
            build_lane: portable
            runner: macos-15-intel
            release_runner: macos-15-intel
            target: x86_64-apple-darwin
            sccache_lane: scryer-macos-x86_64
            sccache_writer_id: scryer-darwin-x86_64-portable
            artifact_name: scryer-darwin-x86_64-portable
            release_profile: release-lean
            install_nasm: true
            extra_rustflags: ""
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TARGET_NAME: scryer-macos-${{ matrix.arch }}
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      SCRYER_CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'rc' || matrix.release_profile }}
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}

      - name: Configure build target
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "CARGO_TARGET_DIR=${GITHUB_WORKSPACE}/target" >> "$GITHUB_ENV"
          else
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/${RELEASE_TARGET_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Restore sccache directory
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: macos-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.sccache
          key: gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        shell: bash
        run: |
          {
            echo "RUSTC_WRAPPER=sccache"
            echo "SCRYER_SCCACHE_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Configure trusted tag sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v')) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Download embedded web artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Install system dependencies
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if [[ "${{ matrix.install_nasm }}" == "true" ]]; then
            packages+=(nasm)
          fi
          if [[ "${#packages[@]}" -gt 0 ]]; then
            brew install "${packages[@]}"
          fi

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sccache --start-server || true
          sccache --zero-stats || true

      - name: Prepare clean local release target
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$CARGO_TARGET_DIR" ]; then
            echo "clean local release target already exists: $CARGO_TARGET_DIR" >&2
            exit 1
          fi
          mkdir -p "$CARGO_TARGET_DIR"
          test -z "$(ls -A "$CARGO_TARGET_DIR")"
          echo "clean local release target contents at start:"
          ls -la "$CARGO_TARGET_DIR"

      - name: Build scryer
        if: steps.scope.outputs.run == 'true'
        id: macos-cargo-build
        shell: bash
        run: |
          set -euo pipefail
          export SCRYER_EMBED_UI_DIR="${GITHUB_WORKSPACE}/scryer-web-out"
          export SCRYER_BUILD_LANE="${{ matrix.build_lane }}"
          export SCRYER_SMG_REGISTRATION_SECRET="${{ secrets.SMG_REGISTRATION_SECRET }}"
          export SCRYER_SMG_GRAPHQL_URL="https://smg.scryer.media/graphql"
          export CMAKE_C_COMPILER="clang"
          export CMAKE_CXX_COMPILER="clang++"
          if [ "${SCRYER_SCCACHE_ENABLED:-false}" = "true" ]; then
            export CC="sccache clang"
            export CXX="sccache clang++"
            export CMAKE_C_COMPILER_LAUNCHER="sccache"
            export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          else
            export CC="clang"
            export CXX="clang++"
          fi
          target_env_suffix="$(printf '%s' "${{ matrix.target }}" | tr '-' '_')"
          target_cflags_var="CFLAGS_${target_env_suffix}"
          target_cxxflags_var="CXXFLAGS_${target_env_suffix}"
          native_flags="-O3 -DNDEBUG -ffunction-sections -fdata-sections -fvisibility=hidden"
          export "${target_cflags_var}=${native_flags}"
          export "${target_cxxflags_var}=${native_flags}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. -A linker-messages"
          if [ -n "${{ matrix.extra_rustflags }}" ]; then
            export RUSTFLAGS="${RUSTFLAGS} ${{ matrix.extra_rustflags }}"
          fi
          {
            clang --version
            printf 'CC=%s\n' "${CC}"
            printf 'CXX=%s\n' "${CXX}"
            printf '%s=%s\n' "${target_cflags_var}" "${!target_cflags_var}"
            printf '%s=%s\n' "${target_cxxflags_var}" "${!target_cxxflags_var}"
            printf 'AWS_LC_SYS_USE_SYSTEM=%s\n' "${AWS_LC_SYS_USE_SYSTEM}"
            printf 'AWS_LC_SYS_STATIC=%s\n' "${AWS_LC_SYS_STATIC}"
            printf 'AWS_LC_SYS_SMALL=%s\n' "${AWS_LC_SYS_SMALL}"
            printf 'AWS_LC_SYS_CMAKE_BUILDER=%s\n' "${AWS_LC_SYS_CMAKE_BUILDER}"
          } | tee "${{ matrix.artifact_name }}-native-build-env.txt"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            cargo build --timings -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}" 2>&1 | tee "${{ matrix.artifact_name }}-build.log"
          else
            python3 .github/scripts/build_heartbeat.py \
              --output "${{ matrix.artifact_name }}-heartbeat.log" \
              --build-log "${{ matrix.artifact_name }}-build.log" \
              --status-file "${{ matrix.artifact_name }}-build-status.json" \
              -- cargo build --timings -p scryer --profile "${SCRYER_CARGO_PROFILE}" --locked --target "${{ matrix.target }}"
          fi

      - name: Validate native linkage
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/${{ matrix.target }}/$SCRYER_CARGO_PROFILE/scryer"
          otool -L "$binary" | tee "${{ matrix.artifact_name }}-native-linkage.txt"
          if grep -Eiq 'aws[-_]?lc|libcrypto' "${{ matrix.artifact_name }}-native-linkage.txt"; then
            echo "::error::macOS release binary links an external AWS-LC or libcrypto library"
            exit 1
          fi

      - name: Validate release build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always() && github.event_name != 'pull_request') }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ matrix.artifact_name }}-heartbeat.log"
          test -s "${{ matrix.artifact_name }}-build-status.json"
          if [ "${{ steps.macos-cargo-build.outcome }}" = "success" ]; then
            test -n "$(find "${CARGO_TARGET_DIR}/cargo-timings" -type f -print -quit 2>/dev/null)"
            build_log="${{ matrix.artifact_name }}-build.log"
            if grep -Eq 'aws-lc-sys@[^:]+: (Building with: System Library|Size-optimized AWS-LC build enabled)' "$build_log"; then
              echo "::error::Release build log reports an unsupported AWS-LC build mode"
              exit 1
            fi
          fi

      # Proves the wrapper can create a WKWebView and load a real document over
      # the loopback interface, without the Scryer server being involved. Only
      # the arm64 lane runs it: the x86_64 runner would have to launch WebKit
      # under Rosetta, and the wrapper source is identical across both targets.
      - name: Smoke test WebKit wrapper
        if: ${{ steps.scope.outputs.run == 'true' && matrix.arch == 'arm64' }}
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}/scryer-tray" --webview-smoke \
            2>&1 | tee "${{ matrix.artifact_name }}-webview-smoke.log"

      # Scryer ships unsigned: build-app.sh ad-hoc signs the assembled bundle so
      # it runs on Apple silicon, and the disk image below wraps that bundle. The
      # optional signing steps re-sign over it when an identity is configured.
      - name: Assemble Scryer.app
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "scryer"))')"
          packaging/macos/build-app.sh \
            --version "$version" \
            --scryer "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}/scryer" \
            --tray "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}/scryer-tray" \
            --output dist/app

      # The secrets context is not readable from a step `if:`, so whether a real
      # Developer ID is available has to be decided in a step body and published
      # as an output. Every signing and signature-verifying step below is gated
      # on it; with no identity configured they are skipped outright and the
      # unsigned, ad-hoc-signed image is what ships.
      - name: Detect macOS signing identity
        id: signing
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request') }}
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CERT_P12}" ] && [ -n "${CERT_PASSWORD}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple signing secrets are not configured; shipping the ad-hoc signed bundle."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Codesign binary
        if: ${{ steps.scope.outputs.run == 'true' && steps.signing.outputs.signed == 'true' }}
        env:
          CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASS="ci-ephemeral"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo -n "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          codesign --sign "Scryer Media Signing" --identifier media.scryer.app --force "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}/scryer"
          codesign --verify --verbose "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}/scryer"
          # The bundle carries its own copies, made before the signature above,
          # so each executable is signed where it will actually be shipped and
          # the bundle is sealed around them last, replacing the ad-hoc seal.
          # Hardened runtime and a secure timestamp are preconditions for
          # notarization; they cost nothing when the image ships unnotarized.
          codesign --sign "Scryer Media Signing" --identifier media.scryer.app --options runtime --timestamp --force dist/app/Scryer.app/Contents/MacOS/scryer
          codesign --sign "Scryer Media Signing" --identifier media.scryer.app --options runtime --timestamp --force dist/app/Scryer.app/Contents/MacOS/scryer-tray
          codesign --sign "Scryer Media Signing" --identifier media.scryer.app --options runtime --timestamp --force dist/app/Scryer.app
          codesign --verify --deep --verbose dist/app/Scryer.app
          rm /tmp/cert.p12
          # The keychain stays for the disk-image signature below and is removed
          # by the dedicated cleanup step.

      - name: Package tarball
        if: steps.scope.outputs.run == 'true'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C "$CARGO_TARGET_DIR/${{ matrix.target }}/${SCRYER_CARGO_PROFILE}" scryer

      # Built from dist/app as it stands, so on a signed build the image wraps
      # the already-signed bundle. Re-signing anything after this point would
      # break the seal the image carries.
      - name: Build disk image
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          packaging/macos/build-dmg.sh \
            --app dist/app/Scryer.app \
            --output scryer-darwin-${{ matrix.arch }}.dmg

      - name: Codesign disk image
        if: ${{ steps.scope.outputs.run == 'true' && steps.signing.outputs.signed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "ci-ephemeral" build.keychain-db
          codesign --sign "Scryer Media Signing" --timestamp --force scryer-darwin-${{ matrix.arch }}.dmg
          codesign --verify --verbose scryer-darwin-${{ matrix.arch }}.dmg

      # Optional lane on top of the optional signing lane. It needs an App Store
      # Connect API key published as APPLE_NOTARY_KEY (base64 of the .p8),
      # APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER. Without them the release
      # still ships a signed but unnotarized image.
      - name: Notarize disk image
        if: ${{ steps.scope.outputs.run == 'true' && steps.signing.outputs.signed == 'true' }}
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          # The secrets context is not readable from a step `if:`, so the
          # absent-secret no-op has to be decided here.
          if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "notary key not configured; shipping the image unnotarized"
            exit 0
          fi
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key_file"
          xcrun notarytool submit scryer-darwin-${{ matrix.arch }}.dmg \
            --key "$key_file" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER" \
            --wait
          xcrun stapler staple scryer-darwin-${{ matrix.arch }}.dmg
          xcrun stapler validate scryer-darwin-${{ matrix.arch }}.dmg

      # The upgrade artifact for an `.app` install. Archived after every step
      # that touches the bundle, so what ships carries the bundle's final
      # signature and extracts back to a bundle `codesign --verify --deep
      # --strict` still accepts. The archive is rooted at `Scryer.app/`, which
      # is what the signed manifest lists and what the client extracts beside
      # the installed bundle.
      #
      # `COPYFILE_DISABLE` keeps bsdtar from emitting AppleDouble `._` members
      # for extended attributes: those are not part of the sealed bundle, and
      # the upgrade extractor would have to write files the manifest does not
      # list.
      - name: Package app bundle archive
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          COPYFILE_DISABLE=1 tar -czf scryer-darwin-${{ matrix.arch }}.app.tar.gz \
            -C dist/app Scryer.app

      # Proves the round trip the upgrade actually performs: extract the archive
      # somewhere else and check the bundle still verifies. A lost executable
      # bit or a mangled `_CodeSignature` fails here rather than on a user's
      # machine after their application has already been replaced.
      - name: Validate app bundle archive
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf scryer-darwin-${{ matrix.arch }}.app.tar.gz -C "$extracted"
          test -x "$extracted/Scryer.app/Contents/MacOS/scryer"
          test -x "$extracted/Scryer.app/Contents/MacOS/scryer-tray"
          codesign --verify --deep --strict "$extracted/Scryer.app"

      - name: Remove signing keychain
        if: ${{ steps.scope.outputs.run == 'true' && (always() && steps.signing.outputs.signed == 'true') }}
        run: security delete-keychain build.keychain-db || true

      # Mounting is the only check that sees what a user sees: the layout is
      # baked into a .DS_Store the build wrote, not into any file list. The
      # bundle is native to this runner, so the tray binary is actually run.
      # Signature verification happens only when a real identity signed it;
      # an ad-hoc signature has nothing for `--deep --verbose` to vouch for.
      - name: Validate disk image
        if: steps.scope.outputs.run == 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$(mktemp -d)/scryer"
          mkdir -p "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" scryer-darwin-${{ matrix.arch }}.dmg
          test -d "$mount_point/Scryer.app"
          test "$(readlink "$mount_point/Applications")" = "/Applications"
          test -f "$mount_point/.background.tiff"
          test -f "$mount_point/.VolumeIcon.icns"
          test -f "$mount_point/.DS_Store"
          test -x "$mount_point/Scryer.app/Contents/MacOS/scryer-tray"
          test -x "$mount_point/Scryer.app/Contents/MacOS/scryer"
          "$mount_point/Scryer.app/Contents/MacOS/scryer-tray" --version
          if [ "$SIGNED" = "true" ]; then
            codesign --verify --deep --verbose "$mount_point/Scryer.app"
          fi

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          else
            echo "sccache not installed; skipping stats" | tee "${{ matrix.artifact_name }}-sccache-stats.txt"
          fi

      - name: Upload release package
        if: ${{ steps.scope.outputs.run == 'true' && (success()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            scryer-darwin-${{ matrix.arch }}.dmg
            scryer-darwin-${{ matrix.arch }}.app.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics-${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-heartbeat.log
            ${{ matrix.artifact_name }}-build-status.json
            ${{ matrix.artifact_name }}-native-build-env.txt
            ${{ matrix.artifact_name }}-native-linkage.txt
            ${{ matrix.artifact_name }}-webview-smoke.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
            ${{ github.event_name == 'pull_request' && format('{0}/target/cargo-timings/*', github.workspace) || format('{0}/{1}/cargo-timings/*', runner.temp, env.RELEASE_TARGET_NAME) }}
          if-no-files-found: warn
          retention-days: 14

  windows-build:
    name: windows-${{ matrix.arch }}
    runs-on: ${{ github.event_name == 'pull_request' && matrix.runner || matrix.release_runner }}
    timeout-minutes: 120
    needs: [changes, web, builtins-provenance, release-trust]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            msi_arch: x64
            runner: windows-2025
            release_runner: windows-2025
            toolchain: 1.97.1-x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            sccache_lane: scryer-windows-x86_64-msvc
            sccache_writer_id: scryer-windows-x86_64
            artifact_name: scryer-windows-x86_64
            release_profile: release
            install_nasm: true
            use_clang_cl: true
            use_lld_link: true
          - arch: arm64
            msi_arch: arm64
            runner: windows-11-vs2026-arm
            release_runner: windows-11-vs2026-arm
            toolchain: 1.97.1-aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            sccache_lane: scryer-windows-arm64-msvc
            sccache_writer_id: scryer-windows-arm64
            artifact_name: scryer-windows-arm64
            release_profile: release-thin
            install_nasm: false
            use_clang_cl: true
            use_lld_link: true
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RELEASE_TARGET_NAME: scryer-windows-${{ matrix.arch }}
      AWS_LC_SYS_USE_SYSTEM: "0"
      AWS_LC_SYS_STATIC: "1"
      AWS_LC_SYS_SMALL: "0"
      AWS_LC_SYS_CMAKE_BUILDER: "0"
      SCRYER_CARGO_PROFILE: ${{ github.event_name == 'pull_request' && 'rc' || matrix.release_profile }}
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_CACHE_SIZE: 10G
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - name: Check applicable changes
        id: scope
        env:
          CLASSIFICATION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.full }}
          READY: ${{ needs.changes.outputs.full == 'true' && needs.web.result == 'success' && needs.builtins-provenance.result == 'success' && (github.event_name == 'pull_request' || needs.release-trust.result == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = success
          if [ "$REQUIRED" = true ]; then
            test "$READY" = true
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            test "$REQUIRED" = false
            echo "No applicable changes; check passed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.scope.outputs.run == 'true'

      - uses: ./.github/actions/download-builtins
        if: steps.scope.outputs.run == 'true'
        with:
          run-id: ${{ github.run_id }}

      - name: Configure build target
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $targetDir = Join-Path $env:GITHUB_WORKSPACE 'target'
          } else {
            $targetDir = Join-Path $env:RUNNER_TEMP $env:RELEASE_TARGET_NAME
          }
          "CARGO_TARGET_DIR=$targetDir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.scope.outputs.run == 'true'
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Restore sccache directory
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: windows-sccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}\.sccache
          key: gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-${{ github.run_id }}
          restore-keys: |
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'Cargo.toml') }}-
            gha-sccache-v5-${{ matrix.sccache_lane }}-rc-

      - name: Install sccache
        if: steps.scope.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Configure sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SCRYER_SCCACHE_ENABLED=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure trusted internal PR sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-pr/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Configure trusted tag sccache
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v')) }}
        uses: ./.github/actions/configure-sccache-r2
        with:
          endpoint: ${{ secrets.SCCACHE_ENDPOINT }}
          access-key-id: ${{ secrets.SCCACHE_S3_ACCESS_ID }}
          secret-access-key: ${{ secrets.SCCACHE_S3_SECRET }}
          key-prefix: scryer/trusted-release/v1/rust-1.97.1/${{ matrix.target }}/

      - name: Download embedded web artifact
        if: steps.scope.outputs.run == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-web-out-${{ github.run_id }}
          path: scryer-web-out
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          digest-mismatch: error

      - name: Install NASM
        if: ${{ steps.scope.outputs.run == 'true' && (matrix.install_nasm) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip"
          $expectedSha256 = "e0ba5157007abc7b1a65118a96657a961ddf55f7e3f632ee035366dfce039ca4"
          Invoke-WebRequest $url -OutFile nasm.zip
          $actualSha256 = (Get-FileHash nasm.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "NASM checksum mismatch: expected $expectedSha256, got $actualSha256"
          }
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $dir = (Get-ChildItem C:\nasm -Directory | Select-Object -First 1).FullName
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Exclude build dir from Windows Defender
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          # Exclusions only improve build speed; some runner images lack an active Defender service.
          try {
            $defender = Get-Service -Name WinDefend -ErrorAction SilentlyContinue
            if ($null -ne $defender -and $defender.Status -eq 'Running') {
              Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction Stop
              Add-MpPreference -ExclusionPath $env:CARGO_TARGET_DIR -ErrorAction Stop
            } else {
              Write-Host "Windows Defender is not running; skipping optional build exclusions."
            }
          } catch {
            Write-Warning "Could not configure optional Windows Defender build exclusions: $($_.Exception.Message)"
          }

      - name: Prime sccache server
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          sccache --start-server
          sccache --zero-stats

      - name: Prepare clean local release target
        if: ${{ steps.scope.outputs.run == 'true' && (github.event_name != 'pull_request') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:CARGO_TARGET_DIR) {
            throw "clean local release target already exists: $env:CARGO_TARGET_DIR"
          }
          New-Item -ItemType Directory -Path $env:CARGO_TARGET_DIR | Out-Null
          if (Get-ChildItem -Force $env:CARGO_TARGET_DIR) {
            throw "clean local release target is not empty: $env:CARGO_TARGET_DIR"
          }
          Write-Host "clean local release target contents at start:"
          Get-ChildItem -Force $env:CARGO_TARGET_DIR | Format-Table

      - name: Build scryer
        if: steps.scope.outputs.run == 'true'
        id: windows-cargo-build
        shell: pwsh
        env:
          INSTALL_NASM: ${{ matrix.install_nasm }}
          USE_CLANG_CL: ${{ matrix.use_clang_cl }}
          USE_LLD_LINK: ${{ matrix.use_lld_link }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:SCRYER_EMBED_UI_DIR = Join-Path $env:GITHUB_WORKSPACE 'scryer-web-out'
          $env:SCRYER_SMG_REGISTRATION_SECRET = "${{ secrets.SMG_REGISTRATION_SECRET }}"
          $env:SCRYER_SMG_GRAPHQL_URL = "https://smg.scryer.media/graphql"
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=. -C target-feature=+crt-static -W linker-messages"
          # Native C/C++ (aws-lc-sys via its cc builder, libsqlite3-sys, zstd-sys,
          # our own cc::Build) only reaches sccache when CC/CXX name the wrapper
          # explicitly: cc-rs applies the RUSTC_WRAPPER fallback to its default
          # compiler, never to the vswhere-located cl.exe, so a plain MSVC lane
          # compiles every native file uncached on every run. clang-cl is on PATH
          # on the hosted Windows images (the LLVM install that also provides
          # lld-link) and locates the MSVC SDK itself, so no developer shell is
          # needed; the arm64 lane has run this exact wiring with C/C++ and
          # assembler cache hits. cl.exe stays available as the escape hatch
          # (use_clang_cl: false) but is deliberately left unwrapped: `sccache cl`
          # would need INCLUDE/LIB/PATH from a vcvars shell that this job does
          # not set up. NASM-driven asm (aws-lc x86_64) is outside sccache either
          # way. The CMake launcher variables cover the aws-lc-sys cmake fallback
          # (Ninja generator honours them; the VS generator ignores them).
          if ($env:USE_CLANG_CL -eq "true") {
            $compiler = "clang-cl"
            if ($env:SCRYER_SCCACHE_ENABLED -eq "true") {
              $env:CC = "sccache $compiler"
              $env:CXX = "sccache $compiler"
              $env:CMAKE_C_COMPILER_LAUNCHER = "sccache"
              $env:CMAKE_CXX_COMPILER_LAUNCHER = "sccache"
            } else {
              $env:CC = $compiler
              $env:CXX = $compiler
            }
          }
          if ($env:USE_LLD_LINK -eq "true") {
            $env:RUSTFLAGS = "$env:RUSTFLAGS -Clinker=lld-link"
          }
          $targetEnvSuffix = "${{ matrix.target }}".Replace("-", "_")
          $cFlagsName = "CFLAGS_$targetEnvSuffix"
          $cxxFlagsName = "CXXFLAGS_$targetEnvSuffix"
          Set-Item -Path "Env:$cFlagsName" -Value "/O2 /DNDEBUG /Gy /Gw"
          Set-Item -Path "Env:$cxxFlagsName" -Value "/O2 /DNDEBUG /Gy /Gw"
          if ($env:INSTALL_NASM -eq "true") {
            $env:AWS_LC_SYS_PREBUILT_NASM = "0"
          }
          $cFlagsValue = (Get-Item -Path "Env:$cFlagsName").Value
          $cxxFlagsValue = (Get-Item -Path "Env:$cxxFlagsName").Value
          $nativeDiagnostics = @(
            "CC=$env:CC"
            "CXX=$env:CXX"
            "${cFlagsName}=$cFlagsValue"
            "${cxxFlagsName}=$cxxFlagsValue"
            "AWS_LC_SYS_USE_SYSTEM=$env:AWS_LC_SYS_USE_SYSTEM"
            "AWS_LC_SYS_STATIC=$env:AWS_LC_SYS_STATIC"
            "AWS_LC_SYS_SMALL=$env:AWS_LC_SYS_SMALL"
            "AWS_LC_SYS_CMAKE_BUILDER=$env:AWS_LC_SYS_CMAKE_BUILDER"
            "AWS_LC_SYS_PREBUILT_NASM=$env:AWS_LC_SYS_PREBUILT_NASM"
          )
          $nativeDiagnostics | Tee-Object -FilePath "${{ matrix.artifact_name }}-native-build-env.txt"
          clang-cl --version 2>&1 | Tee-Object -FilePath "${{ matrix.artifact_name }}-native-build-env.txt" -Append
          lld-link --version 2>&1 | Tee-Object -FilePath "${{ matrix.artifact_name }}-native-build-env.txt" -Append
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            cargo build --timings -p scryer --bin scryer --bin scryer-tray --profile $env:SCRYER_CARGO_PROFILE --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -FilePath "${{ matrix.artifact_name }}-build.log"
            $cargoExitCode = $LASTEXITCODE
          } else {
            & python .github/scripts/build_heartbeat.py `
              --output "${{ matrix.artifact_name }}-heartbeat.log" `
              --build-log "${{ matrix.artifact_name }}-build.log" `
              --status-file "${{ matrix.artifact_name }}-build-status.json" `
              -- cargo build --timings -p scryer --bin scryer --bin scryer-tray --profile $env:SCRYER_CARGO_PROFILE --locked --target ${{ matrix.target }}
            $cargoExitCode = $LASTEXITCODE
          }
          if ($cargoExitCode -ne 0) {
            exit $cargoExitCode
          }

      - name: Validate native linkage
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $linkage = "${{ matrix.artifact_name }}-native-linkage.txt"
          Remove-Item $linkage -ErrorAction SilentlyContinue
          # scryer-tray.exe must link the WebView2 loader statically: a
          # WebView2Loader.dll import would mean the MSI and the zip, which
          # ship no such DLL, carry a tray that cannot start.
          foreach ($name in @("scryer.exe", "scryer-tray.exe")) {
            $binary = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\$name"
            $imports = & llvm-readobj --coff-imports $binary 2>&1
            if ($LASTEXITCODE -ne 0) {
              $imports | Write-Host
              throw "llvm-readobj failed while inspecting PE imports of $name"
            }
            $imports | Tee-Object -Append -FilePath $linkage
            if ($imports -match '(?i)aws[-_]?lc|libcrypto[^\s]*\.dll|(^|\s)crypto\.dll(\s|$)') {
              throw "$name imports an external AWS-LC or crypto DLL"
            }
            if ($imports -match '(?i)webview2loader') {
              throw "$name imports WebView2Loader.dll instead of linking the loader statically"
            }
          }

      - name: Validate release build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always() && github.event_name != 'pull_request') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "${{ matrix.artifact_name }}-heartbeat.log" -PathType Leaf)) {
            throw "release build heartbeat log is missing"
          }
          if (-not (Test-Path "${{ matrix.artifact_name }}-build-status.json" -PathType Leaf)) {
            throw "release build status is missing"
          }
          if ("${{ steps.windows-cargo-build.outcome }}" -eq "success") {
            $timing = Get-ChildItem -Path (Join-Path $env:CARGO_TARGET_DIR "cargo-timings") -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $timing) {
              throw "successful release build did not produce Cargo timing output"
            }
            $buildLog = Get-Content "${{ matrix.artifact_name }}-build.log" -Raw
            if ($buildLog -match 'aws-lc-sys@[^:]+: (Building with: System Library|Size-optimized AWS-LC build enabled)') {
              throw "release build log reports an unsupported AWS-LC build mode"
            }
          }

      - name: Verify embedded Windows manifest
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe"
          $mt = (Get-Command mt.exe -ErrorAction SilentlyContinue).Source
          if (-not $mt) {
            $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $mt) {
            throw "mt.exe was not found; cannot verify embedded Windows manifest"
          }
          & $mt -nologo "-inputresource:$exe;#1" "-out:embedded-manifest.xml"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $manifest = Get-Content embedded-manifest.xml -Raw
          if ($manifest -notmatch '<[^>]*longPathAware\b[^>]*>\s*true\s*</[^>]*longPathAware>') {
            throw "embedded manifest does not contain longPathAware=true"
          }

      # The wrapper hosts WebView2, so the runtime it needs is a build-time
      # dependency of this check even though nothing links against it. The
      # printed result only reaches the log when stdout is redirected — the
      # wrapper is a GUI-subsystem binary — so the exit code is the gate.
      - name: Smoke test WebView2 wrapper
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer-tray.exe"
          $log = "${{ matrix.artifact_name }}-webview-smoke.log"

          $runtimeKeys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          $installed = $false
          foreach ($key in $runtimeKeys) {
            if (Test-Path $key) {
              $installed = $true
              break
            }
          }

          if (-not $installed) {
            Write-Host "WebView2 Evergreen runtime not found; installing it"
            $wingetInstalled = $false
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              try {
                winget install --id Microsoft.EdgeWebView2Runtime --exact --silent `
                  --accept-package-agreements --accept-source-agreements
                if ($LASTEXITCODE -eq 0) { $wingetInstalled = $true }
              } catch {
                Write-Warning "winget could not install the WebView2 runtime: $($_.Exception.Message)"
              }
            }
            if (-not $wingetInstalled) {
              Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe
              $installer = Start-Process -FilePath .\MicrosoftEdgeWebview2Setup.exe `
                -ArgumentList "/silent","/install" -PassThru -Wait
              if ($installer.ExitCode -ne 0) {
                throw "the WebView2 runtime installer exited with $($installer.ExitCode)"
              }
            }
          }

          & $exe --webview-smoke 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "scryer-tray --webview-smoke failed with exit code $LASTEXITCODE"
          }

      - name: Create README.txt
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          @"
          scryer for Windows
          ==================

          Desktop Quick Start
          -------------------
          1. Double-click scryer-tray.exe.
          2. Scryer starts locally and opens http://localhost:8080.
          3. The tray menu can open, stop, restart, or exit Scryer.

          The tray keeps desktop data, logs, and runtime state in:

              %LOCALAPPDATA%\ScryerMedia\Scryer

          It uses the ScryerMedia.Scryer.Desktop.v1 Credential Manager namespace.
          It never reads or changes legacy portable Scryer data.

          Command-Line Use
          ----------------
          scryer.exe remains available for terminals and automation. It uses its
          existing default data directory unless you pass --data-dir:

              scryer.exe --data-dir C:\scryer-data

          Unsigned Windows Build
          ----------------------
          These files are deliberately unsigned. Windows may show a browser download
          warning, a SmartScreen "More info" prompt, and an "Unknown publisher" UAC
          prompt for the MSI. Verify the SHA-256 checksum and GitHub build provenance
          published with the release before proceeding.

          Encryption Key
          --------------
          Scryer encrypts passwords and API keys stored in its database.
          On first run an encryption key is auto-generated and stored
          securely by Windows. No manual key management is needed.

          To override the key (advanced), set the environment variable
          SCRYER_ENCRYPTION_KEY before starting scryer.

          Long Paths
          ----------
          scryer.exe is long-path-aware. Windows must also have long paths
          enabled system-wide (LongPathsEnabled=1) for paths beyond the
          legacy 260-character limit to work reliably.

          Environment Variables
          ---------------------
          SCRYER_MOVIES_PATH      Movies directory
          SCRYER_SERIES_PATH      Series directory
          SCRYER_BIND             Listen address (default: 127.0.0.1:8080)
          SCRYER_OPEN_BROWSER     Set to "false" to disable auto-open
          SCRYER_DB_PATH          Override database path (advanced)
          "@ | Set-Content -Path README.txt -Encoding UTF8

      - name: Package zip
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "${{ matrix.artifact_name }}-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item `
            "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe", `
            "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer-tray.exe", `
            LICENSE, README.txt `
            -Destination $stage -Force
          # The human-facing download. Built with the runner's own zip tooling so
          # no Rust ZIP crate is needed anywhere in the workspace.
          Compress-Archive -Path "$stage\*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      # The upgrade channel consumes tar.gz on every platform, Windows included,
      # so the in-app upgrade engine only ever walks one container format. Member
      # names are passed explicitly: bsdtar would otherwise prefix them with "./",
      # which the signed manifest's member paths do not use.
      - name: Package portable tarball
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "${{ matrix.artifact_name }}-stage"
          tar --create --gzip `
            --file "${{ matrix.artifact_name }}-portable.tar.gz" `
            --directory $stage `
            scryer.exe scryer-tray.exe LICENSE README.txt
          if ($LASTEXITCODE -ne 0) {
            throw "tar failed to package the portable upgrade artifact"
          }

      - name: Install WiX v4
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolPath = Join-Path $env:RUNNER_TEMP "wix"
          dotnet tool install --tool-path $toolPath wix --version 4.0.5
          $toolPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Package unsigned MSI
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "scryer" } | Select-Object -First 1).version
          Copy-Item crates\scryer\resources\windows\scryer.ico "${{ matrix.artifact_name }}-stage\scryer.ico" -Force
          .\packaging\windows\build-msi.ps1 `
            -Architecture ${{ matrix.msi_arch }} `
            -StageDir "${{ matrix.artifact_name }}-stage" `
            -Version $version `
            -OutputPath "${{ matrix.artifact_name }}.msi" `
            -DistributionOwner msi
          .\packaging\windows\build-msi.ps1 `
            -Architecture ${{ matrix.msi_arch }} `
            -StageDir "${{ matrix.artifact_name }}-stage" `
            -Version $version `
            -OutputPath "${{ matrix.artifact_name }}-winget.msi" `
            -DistributionOwner winget

      - name: Validate packaged Windows artifact
        if: steps.scope.outputs.run == 'true'
        shell: pwsh
        run: |
          .\.github\scripts\validate-windows-package.ps1 `
            -Architecture ${{ matrix.arch }} `
            -ZipPath "${{ matrix.artifact_name }}.zip" `
            -TarballPath "${{ matrix.artifact_name }}-portable.tar.gz" `
            -MsiPath "${{ matrix.artifact_name }}.msi" `
            -MsiMetadataPath "${{ matrix.artifact_name }}.msi.json" `
            -WingetMsiPath "${{ matrix.artifact_name }}-winget.msi" `
            -WingetMsiMetadataPath "${{ matrix.artifact_name }}-winget.msi.json" `
            -BuiltExePath "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer.exe" `
            -BuiltTrayPath "$env:CARGO_TARGET_DIR\${{ matrix.target }}\$env:SCRYER_CARGO_PROFILE\scryer-tray.exe"

      - name: Show sccache stats
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats | Tee-Object -FilePath "${{ matrix.artifact_name }}-sccache-stats.txt"
          } else {
            "sccache not installed; skipping stats" | Tee-Object -FilePath "${{ matrix.artifact_name }}-sccache-stats.txt"
          }

      - name: Upload release package
        if: ${{ steps.scope.outputs.run == 'true' && (success()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}-portable.tar.gz
            ${{ matrix.artifact_name }}.msi
            ${{ matrix.artifact_name }}.msi.json
            ${{ matrix.artifact_name }}-winget.msi
            ${{ matrix.artifact_name }}-winget.msi.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-diagnostics-${{ matrix.artifact_name }}-${{ github.run_id }}
          path: |
            ${{ matrix.artifact_name }}-build.log
            ${{ matrix.artifact_name }}-heartbeat.log
            ${{ matrix.artifact_name }}-build-status.json
            ${{ matrix.artifact_name }}-native-build-env.txt
            ${{ matrix.artifact_name }}-native-linkage.txt
            ${{ matrix.artifact_name }}-webview-smoke.log
            ${{ matrix.artifact_name }}-defender-scan.log
            ${{ matrix.artifact_name }}-attachment-services.log
            ${{ matrix.artifact_name }}-noarg-startup.log
            ${{ matrix.artifact_name }}-winget-install.log
            ${{ matrix.artifact_name }}-msi-install.log
            ${{ matrix.artifact_name }}-sccache-stats.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload cargo timings
        if: ${{ steps.scope.outputs.run == 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-timings-${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ github.event_name == 'pull_request' && format('{0}/target/cargo-timings/*', github.workspace) || format('{0}/{1}/cargo-timings/*', runner.temp, env.RELEASE_TARGET_NAME) }}
          if-no-files-found: warn
          retention-days: 14

  docker-publish-pr-rc:
    name: docker-publish-pr-rc
    if: ${{ always() && needs.changes.outputs.full == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.rust-clippy.result == 'success' && needs.rust-nextest.result == 'success' && needs.launcher-build.result == 'success' && needs.linux-build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [changes, rust-clippy, rust-nextest, launcher-build, linux-build]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR RC tags
        id: pr_rc_tags
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${HEAD_SHA:0:7}"
          echo "moving_tag=pr-${PR_NUMBER}-rc" >> "$GITHUB_OUTPUT"
          echo "commit_tag=pr-${PR_NUMBER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: pr_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          tags: |
            type=raw,value=${{ steps.pr_rc_tags.outputs.moving_tag }}
            type=raw,value=${{ steps.pr_rc_tags.outputs.commit_tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max,version=v1
          sbom: true
          tags: ${{ steps.pr_meta.outputs.tags }}
          labels: ${{ steps.pr_meta.outputs.labels }}

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${{ github.repository_owner }}/scryer" >> "$GITHUB_OUTPUT"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keylessly sign immutable OCI index
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

      # The signing identity is the PR merge ref (refs/pull/N/merge), not a tag,
      # so it is read from github.workflow_ref instead of being spelled out.
      - name: Verify keyless OCI signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}

  oci-verify-pr-rc:
    name: verify-oci-pr-rc-trust
    needs: [docker-publish-pr-rc]
    if: ${{ github.event_name == 'pull_request' && needs.docker-publish-pr-rc.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Mirrors oci-verify, minus the slsa-verifier checks: the SLSA generator
      # does not support pull_request, so RC images carry buildx's own
      # provenance attestation rather than a generator-signed one.
      - name: Verify OCI signature, provenance, and SBOM
        shell: bash
        env:
          IMAGE: ${{ needs.docker-publish-pr-rc.outputs.image }}
          DIGEST: ${{ needs.docker-publish-pr-rc.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          index="$(docker buildx imagetools inspect --raw "$immutable_image")"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            subject_digest="$(jq -r \
              --arg os "$os" \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest' \
              <<< "$index")"
            test -n "$subject_digest" && test "$subject_digest" != null
            attestation_digest="$(jq -r \
              --arg subject "$subject_digest" \
              '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $subject) | .digest' \
              <<< "$index")"
            test -n "$attestation_digest" && test "$attestation_digest" != null
            attestation="$(docker buildx imagetools inspect --raw "${IMAGE}@${attestation_digest}")"
            jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")' > /dev/null <<< "$attestation"
            jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and (.annotations["in-toto.io/predicate-type"] | startswith("https://slsa.dev/provenance/")))' > /dev/null <<< "$attestation"
          done

  release-trust:
    name: verify-release-trust
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout signed release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify trusted SSH tag signature and release branch ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            scryer-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          release_branch="release-${RELEASE_TAG#scryer-v}"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/release-signing/allowed_signers"
          git verify-tag "$RELEASE_TAG"
          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          tag_target="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$tag_target" "origin/$release_branch"; then
            echo "$RELEASE_TAG is not reachable from origin/$release_branch" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$tag_target"; then
            echo "$release_branch must be created from the current origin/main before release" >&2
            exit 1
          fi

  docker-publish:
    name: docker-publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, rust-clippy, rust-nextest, launcher-build, linux-build]
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download linux amd64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scryer-linux-x86_64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download linux arm64 portable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scryer-linux-arm64-portable-${{ github.run_id }}
          path: artifacts

      - name: Download launcher amd64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-linux-amd64-${{ github.run_id }}
          path: artifacts

      - name: Download launcher arm64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launcher-linux-arm64-${{ github.run_id }}
          path: artifacts

      - name: Prepare build context
        run: sh docker/prepare-build-context.sh artifacts docker-ctx

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve docker release-line tag
        id: docker_release_line
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ github.ref_name }}"
          if [[ ! "$RELEASE_TAG" =~ ^scryer-v0\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "unexpected release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
          LINE_TAG="${BASH_REMATCH[1]}-latest"
          echo "line_tag=${LINE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/scryer
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.docker_release_line.outputs.line_tag }}
            type=sha
            type=match,pattern=scryer-v(.*),group=1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker-ctx
          file: docker/scryer.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max,version=v1
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resolve immutable image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${{ github.repository_owner }}/scryer" >> "$GITHUB_OUTPUT"
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keylessly sign immutable OCI index
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

      - name: Verify keyless OCI signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}"

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}

  container-provenance:
    name: container-slsa-provenance
    needs: [docker-publish]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-publish.outputs.image }}
      digest: ${{ needs.docker-publish.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  oci-verify:
    name: verify-oci-release-trust
    needs: [docker-publish, container-provenance]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify OCI signature, provenance, and SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.docker-publish.outputs.image }}
          DIGEST: ${{ needs.docker-publish.outputs.digest }}
        run: |
          set -euo pipefail
          immutable_image="${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          # The SLSA generator still attaches its provenance as a legacy
          # `.att` attestation. Cosign v3 would only search the new-format
          # bundles once the image carries one (its own signature), so ask for
          # the legacy lookup explicitly.
          cosign verify-attestation \
            --new-bundle-format=false \
            --type slsaprovenance \
            --certificate-identity "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable_image"
          slsa-verifier verify-image "$immutable_image" \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}"
          index="$(docker buildx imagetools inspect --raw "$immutable_image")"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            subject_digest="$(jq -r \
              --arg os "$os" \
              --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == $os and .platform.architecture == $architecture) | .digest' \
              <<< "$index")"
            test -n "$subject_digest" && test "$subject_digest" != null
            attestation_digest="$(jq -r \
              --arg subject "$subject_digest" \
              '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest" and .annotations["vnd.docker.reference.digest"] == $subject) | .digest' \
              <<< "$index")"
            test -n "$attestation_digest" && test "$attestation_digest" != null
            docker buildx imagetools inspect --raw "${IMAGE}@${attestation_digest}" |
              jq -e 'any(.layers[]; .mediaType == "application/vnd.in-toto+json" and .annotations["in-toto.io/predicate-type"] == "https://spdx.dev/Document")' > /dev/null
          done

  release:
    name: publish-release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, rust-clippy, rust-nextest, linux-build, macos-build, windows-build, oci-verify, archive-provenance]
    environment:
      name: release-credentials
    permissions:
      contents: write
      id-token: write
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - name: Resolve release tag
        id: release_meta
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          echo "tag_name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_meta.outputs.tag_name }}
          fetch-depth: 1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: scryer-*-${{ github.run_id }}
          merge-multiple: true

      - name: Download SLSA archive provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scryer-provenance.intoto.jsonl
          path: release-artifacts

      - name: Install SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify every release subject with SLSA provenance
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          slsa-verifier verify-artifact \
            --provenance-path scryer-provenance.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}" \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-darwin-arm64.app.tar.gz \
            scryer-darwin-x86_64.app.tar.gz \
            scryer-darwin-arm64.dmg \
            scryer-darwin-x86_64.dmg \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64-portable.tar.gz \
            scryer-windows-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-windows-arm64-winget.msi \
            scryer-windows-x86_64-winget.msi \
            scryer-winget-manifests.tar.gz

      - name: Generate deterministic checksums
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-darwin-arm64.app.tar.gz \
            scryer-darwin-x86_64.app.tar.gz \
            scryer-darwin-arm64.dmg \
            scryer-darwin-x86_64.dmg \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64-portable.tar.gz \
            scryer-windows-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-windows-arm64-winget.msi \
            scryer-windows-x86_64-winget.msi \
            scryer-winget-manifests.tar.gz > scryer-checksums.txt

      # Release blobs are signed twice for interop. The historical
      # `<file>.sigstore.json` name keeps the Cosign v2 legacy bundle that
      # already-shipped clients fetch; `<file>.cosign-v3.sigstore.json` carries
      # the Sigstore v0.3 bundle Cosign v3 emits. Both installs land on PATH
      # under the same binary name, so every call below uses an absolute path.
      - name: Install Cosign v2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
          install-dir: $HOME/.cosign-v2

      - name: Install Cosign v3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
          install-dir: $HOME/.cosign-v3

      - name: Define dual Cosign signing helper
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cosign-dual-sign.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # usage: cosign-dual-sign.sh <blob> <certificate-identity>
          set -euo pipefail
          blob="$1"
          identity="$2"
          issuer="https://token.actions.githubusercontent.com"
          legacy_bundle="${blob}.sigstore.json"
          v3_bundle="${blob}.cosign-v3.sigstore.json"

          "$HOME/.cosign-v2/cosign" sign-blob --yes --bundle "$legacy_bundle" "$blob"
          "$HOME/.cosign-v2/cosign" verify-blob --bundle "$legacy_bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$blob"
          jq -e 'has("base64Signature") and has("rekorBundle")' "$legacy_bundle" >/dev/null \
            || { echo "::error::$legacy_bundle is not a Cosign v2 legacy bundle"; exit 1; }

          "$HOME/.cosign-v3/cosign" sign-blob --yes --bundle "$v3_bundle" "$blob"
          "$HOME/.cosign-v3/cosign" verify-blob --bundle "$v3_bundle" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$blob"
          # Scryer's verifier understands Rekor v1 (hashedrekord 0.0.1) entries
          # only; fail the release if Cosign starts logging somewhere else.
          jq -e '(.mediaType | startswith("application/vnd.dev.sigstore.bundle"))
                 and (.verificationMaterial.tlogEntries | length == 1)
                 and (.verificationMaterial.tlogEntries[0].kindVersion
                      == {"kind": "hashedrekord", "version": "0.0.1"})' "$v3_bundle" >/dev/null \
            || { echo "::error::$v3_bundle is not a Sigstore bundle with a Rekor v1 hashedrekord entry"; exit 1; }
          SCRIPT
          chmod +x "$RUNNER_TEMP/cosign-dual-sign.sh"

      - name: Sign and verify checksum manifest
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign-dual-sign.sh" scryer-checksums.txt \
            "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}"

      - name: Download WinGet xtask binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: winget-tools

      - name: Generate and sign upgrade manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#scryer-v}"
          chmod +x winget-tools/xtask-release
          ./winget-tools/xtask-release ci upgrade-manifest \
            --version "$VERSION" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --artifacts-dir release-artifacts \
            --schema v1 \
            --output release-artifacts/scryer-upgrade-manifest.json
          "$RUNNER_TEMP/cosign-dual-sign.sh" release-artifacts/scryer-upgrade-manifest.json \
            "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}"
          # v2 is published beside v1 for the whole transition. v1 is frozen and
          # can never carry anything new, so every client that understands v2
          # reads v2; clients older than v2 keep reading v1 untouched. Both are
          # signed by the same workflow identity for the same tag.
          ./winget-tools/xtask-release ci upgrade-manifest \
            --version "$VERSION" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --artifacts-dir release-artifacts \
            --schema v2 \
            --output release-artifacts/scryer-upgrade-manifest.v2.json
          "$RUNNER_TEMP/cosign-dual-sign.sh" release-artifacts/scryer-upgrade-manifest.v2.json \
            "https://github.com/${{ github.repository }}/.github/workflows/scryer.yml@refs/tags/${{ github.ref_name }}"

      - name: Verify release notes
        run: test -s "release-notes/${{ steps.release_meta.outputs.tag_name }}.md"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.tag_name }}
          body_path: release-notes/${{ steps.release_meta.outputs.tag_name }}.md
          files: |
            release-artifacts/scryer-*.tar.gz
            release-artifacts/scryer-darwin-arm64.dmg
            release-artifacts/scryer-darwin-x86_64.dmg
            release-artifacts/scryer-*.zip
            release-artifacts/scryer-windows-arm64.msi
            release-artifacts/scryer-windows-x86_64.msi
            release-artifacts/scryer-windows-arm64-winget.msi
            release-artifacts/scryer-windows-x86_64-winget.msi
            release-artifacts/scryer-checksums.txt
            release-artifacts/scryer-checksums.txt.sigstore.json
            release-artifacts/scryer-checksums.txt.cosign-v3.sigstore.json
            release-artifacts/scryer-upgrade-manifest.json
            release-artifacts/scryer-upgrade-manifest.json.sigstore.json
            release-artifacts/scryer-upgrade-manifest.json.cosign-v3.sigstore.json
            release-artifacts/scryer-upgrade-manifest.v2.json
            release-artifacts/scryer-upgrade-manifest.v2.json.sigstore.json
            release-artifacts/scryer-upgrade-manifest.v2.json.cosign-v3.sigstore.json
            release-artifacts/scryer-provenance.intoto.jsonl
          fail_on_unmatched_files: true

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_PUSH_TOKEN not set; skipping tap update."
            exit 0
          fi
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#scryer-v}"
          LINUX_X86_SHA=$(shasum -a 256 release-artifacts/scryer-linux-x86_64-portable.tar.gz | cut -d ' ' -f1)
          LINUX_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-linux-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_ARM_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-arm64-portable.tar.gz | cut -d ' ' -f1)
          DARWIN_X86_SHA=$(shasum -a 256 release-artifacts/scryer-darwin-x86_64-portable.tar.gz | cut -d ' ' -f1)
          REPO="${{ github.repository }}"

          mkdir -p tap/Formula
          cat > tap/Formula/scryer.rb << FORMULA
          class Scryer < Formula
            desc "Self-hosted media acquisition and management platform"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            def install_support_files
              (pkgshare/"config.env.example").write <<~EOS
                # Homebrew-managed Scryer service overrides.
                SCRYER_BIND=127.0.0.1:8686
              EOS

              (libexec/"scryer-service").write <<~SH
                #!/bin/sh
                CONFIG_FILE="#{etc}/scryer/config.env"

                if [ -f "\$CONFIG_FILE" ]; then
                  set -a
                  . "\$CONFIG_FILE"
                  set +a
                fi

                SCRYER_PACKAGE=homebrew
                export SCRYER_PACKAGE

                exec "#{opt_bin}/scryer" --data-dir "#{var}/scryer" "\$@"
              SH

              chmod 0755, libexec/"scryer-service"
            end

            on_macos do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-arm64-portable.tar.gz"
                sha256 "${DARWIN_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-darwin-x86_64-portable.tar.gz"
                sha256 "${DARWIN_X86_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-arm64-portable.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              end

              on_intel do
                url "https://github.com/${REPO}/releases/download/scryer-v${VERSION}/scryer-linux-x86_64-portable.tar.gz"
                sha256 "${LINUX_X86_SHA}"
              end
            end

            def install
              bin.install "scryer"
              install_support_files

              config_dir = etc/"scryer"
              config_dir.mkpath
              (var/"scryer").mkpath
              (var/"log").mkpath
              config_file = config_dir/"config.env"
              unless config_file.exist?
                config_file.write <<~EOS
                  SCRYER_BIND=127.0.0.1:8686
                EOS
              end
            end

            def caveats
              <<~EOS
                Edit #{etc}/scryer/config.env to customize the Homebrew-managed service,
                then restart it with:
                  brew services restart scryer
              EOS
            end

            service do
              run [opt_libexec/"scryer-service"]
              keep_alive true
              log_path var/"log/scryer.log"
              error_log_path var/"log/scryer.log"
            end

            test do
              assert_match "scryer", shell_output("#{bin}/scryer --version")
            end
          end
          FORMULA

          sed -i 's/^          //' tap/Formula/scryer.rb

          git clone "https://${TAP_TOKEN}@github.com/scryer-media/homebrew-scryer.git" tap-repo
          mkdir -p tap-repo/Formula
          cp tap/Formula/scryer.rb tap-repo/Formula/scryer.rb
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/scryer.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
          else
            git commit -m "scryer ${VERSION}"
            git push origin HEAD:main
          fi

      - name: Rebuild website for released GraphQL schema
        continue-on-error: true
        env:
          WEB_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEB_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN not set; skipping site rebuild."
            exit 0
          fi
          git clone "https://${WEB_TOKEN}@github.com/scryer-media/web.git" web-repo
          cd web-repo
          git config user.name "github-actions[bot]"
          git config user.email "133935777+NZBMan@users.noreply.github.com"
          git commit --allow-empty -m "rebuild: ${{ github.ref_name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Website rebuild commit pushed for ${{ github.ref_name }}."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to push website rebuild commit after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Website main advanced; rebasing rebuild commit before retrying." >&2
            git pull --rebase origin main
          done

  winget-prep:
    name: winget-prep
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: [release-trust, windows-build, winget-xtask-build]
    permissions:
      contents: read
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'scryer-v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WinGet xtask binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: winget-xtask-release-${{ github.run_id }}
          path: winget-tools

      - name: Prepare WinGet xtask binary
        run: chmod +x winget-tools/xtask-release

      - name: Download Windows release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: scryer-windows-*-${{ github.run_id }}
          merge-multiple: true

      - name: Resolve WinGet metadata
        id: winget_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#scryer-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Generate WinGet manifests
        shell: bash
        run: |
          set -euo pipefail
          ./winget-tools/xtask-release ci winget \
            --version "${{ steps.winget_meta.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --repository "${{ github.repository }}" \
            --release-date "${{ steps.winget_meta.outputs.release_date }}" \
            --artifacts-dir release-artifacts \
            --output-dir winget-manifests

      - name: Upload WinGet manifest artifact
        run: tar -C winget-manifests -czf scryer-winget-manifests.tar.gz .

      - name: Upload packaged WinGet manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: scryer-winget-manifests.tar.gz
          if-no-files-found: error
          retention-days: 30

  release-subjects:
    name: prepare-release-subjects
    needs: [release-trust, linux-build, macos-build, windows-build, winget-prep]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - name: Download release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: scryer-*-${{ github.run_id }}
          merge-multiple: true

      - name: Generate deterministic subject list
        id: subjects
        working-directory: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            scryer-darwin-arm64-portable.tar.gz \
            scryer-darwin-x86_64-portable.tar.gz \
            scryer-darwin-arm64.app.tar.gz \
            scryer-darwin-x86_64.app.tar.gz \
            scryer-darwin-arm64.dmg \
            scryer-darwin-x86_64.dmg \
            scryer-linux-arm64-portable.tar.gz \
            scryer-linux-x86_64-portable.tar.gz \
            scryer-windows-arm64-portable.tar.gz \
            scryer-windows-x86_64-portable.tar.gz \
            scryer-windows-arm64.zip \
            scryer-windows-x86_64.zip \
            scryer-windows-arm64.msi \
            scryer-windows-x86_64.msi \
            scryer-windows-arm64-winget.msi \
            scryer-windows-x86_64-winget.msi \
            scryer-winget-manifests.tar.gz > scryer-subjects.sha256
          echo "base64_subjects=$(base64 < scryer-subjects.sha256 | tr -d '\n')" >> "$GITHUB_OUTPUT"

  archive-provenance:
    name: archive-slsa-provenance
    needs: [release-subjects]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release-subjects.outputs.base64_subjects }}
      provenance-name: scryer-provenance.intoto.jsonl

  winget-published-install:
    name: winget-published-install
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') }}
    needs: [release, winget-prep]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download generated WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Install the published x64 MSI through WinGet
        shell: pwsh
        run: |
          $manifestRoot = ".\\winget-manifests"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          tar -xzf winget-submission/scryer-winget-manifests.tar.gz -C $manifestRoot
          $version = "${{ github.ref_name }}".Replace("scryer-v", "")
          .\.github\scripts\validate-published-winget-install.ps1 `
            -ManifestRoot $manifestRoot `
            -ExpectedVersion $version

  winget-submit:
    name: winget-submit
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/scryer-v') && vars.WINGET_AUTO_SUBMISSION_ENABLED == 'true' }}
    needs: [winget-published-install]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment: release-credentials
    steps:
      - name: Download verified WinGet manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scryer-winget-manifests-${{ github.run_id }}
          path: winget-submission

      - name: Submit WinGet manifest pull request
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "WINGET_TOKEN is required to submit the WinGet manifest pull request." >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#scryer-v}"
          BRANCH="scryer-media-scryer-${VERSION}"
          ARCHIVE="${GITHUB_WORKSPACE}/winget-submission/scryer-winget-manifests.tar.gz"
          STAGING_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGING_DIR"' EXIT

          test -s "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
          MANIFEST_SOURCE="$STAGING_DIR/ScryerMedia.Scryer/$VERSION"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.locale.en-US.yaml"
          test -f "$MANIFEST_SOURCE/ScryerMedia.Scryer.installer.yaml"

          FORK_OWNER="$(gh api user --jq .login)"
          TARGET_PATH="manifests/s/ScryerMedia/Scryer/${VERSION}"
          if gh api "repos/microsoft/winget-pkgs/contents/${TARGET_PATH}" > /dev/null 2>&1; then
            echo "ScryerMedia.Scryer ${VERSION} is already published in winget-pkgs."
            exit 0
          fi

          EXISTING_PR="$(gh pr list --repo microsoft/winget-pkgs --state open --head "${FORK_OWNER}:${BRANCH}" --json url --jq '.[0].url // empty')"
          if ! gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
            gh repo fork microsoft/winget-pkgs --clone=false
          fi
          for _ in {1..12}; do
            if gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh api "repos/${FORK_OWNER}/winget-pkgs" > /dev/null

          git clone --depth 1 --filter=blob:none --no-checkout --branch master \
            "https://x-access-token:${GH_TOKEN}@github.com/${FORK_OWNER}/winget-pkgs.git" winget-pkgs
          cd winget-pkgs
          git sparse-checkout init --cone
          git sparse-checkout set manifests/s/ScryerMedia/Scryer
          git checkout master
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          MANIFEST_DESTINATION="$TARGET_PATH"
          if [[ -d "$MANIFEST_DESTINATION" ]]; then
            rm -rf "$MANIFEST_DESTINATION"
          fi
          mkdir -p "$MANIFEST_DESTINATION"
          cp "$MANIFEST_SOURCE"/* "$MANIFEST_DESTINATION/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST_DESTINATION"
          if ! git diff --cached --quiet; then
            git commit -m "Add ScryerMedia.Scryer version ${VERSION}"
            git push origin "$BRANCH"
          fi
          if [[ -z "$EXISTING_PR" ]]; then
            gh pr create \
              --repo microsoft/winget-pkgs \
              --base master \
              --head "${FORK_OWNER}:${BRANCH}" \
              --title "New version: ScryerMedia.Scryer version ${VERSION}" \
              --body "Automated manifest submission for [ScryerMedia.Scryer ${VERSION}](https://github.com/scryer-media/scryer/releases/tag/scryer-v${VERSION})."
          else
            echo "Updated WinGet submission awaiting review: $EXISTING_PR"
          fi
