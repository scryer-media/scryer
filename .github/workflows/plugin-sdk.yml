name: plugin-sdk

on:
  push:
    tags:
      - "plugin-sdk-v*"

concurrency:
  group: plugin-sdk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: true

      - name: Verify SDK tag and metadata
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#plugin-sdk-v}"
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["VERSION"]
          manifest = tomllib.loads(pathlib.Path("crates/scryer-plugin-sdk/Cargo.toml").read_text())
          package_version = manifest["package"]["version"]
          source = pathlib.Path("crates/scryer-plugin-sdk/src/lib.rs").read_text()
          match = re.search(r'pub const SDK_VERSION: &str = "([^"]+)";', source)
          runtime_version = match.group(1) if match else None
          if package_version != expected:
              raise SystemExit(f"Cargo.toml version {package_version} does not match tag {expected}")
          if runtime_version != expected:
              raise SystemExit(f"SDK_VERSION {runtime_version} does not match tag {expected}")
          PY

      - name: Test SDK
        run: cargo test --locked -p scryer-plugin-sdk

      - name: Package SDK
        run: cargo package --locked -p scryer-plugin-sdk

  publish:
    name: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    needs: validate
    environment:
      name: crates-io-publish
      url: https://crates.io/crates/scryer-plugin-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.97.1"

      - name: Authenticate to crates.io through Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish --locked -p scryer-plugin-sdk
