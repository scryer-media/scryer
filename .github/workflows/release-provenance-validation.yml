name: Validate release provenance plumbing

on:
  workflow_dispatch:

permissions: {}

jobs:
  prepare-subject:
    name: prepare-nonpublishing-subject
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create validation subject
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          printf 'Scryer release provenance validation for %s\n' "$GITHUB_SHA" > scryer-provenance-validation.txt
          sha256sum scryer-provenance-validation.txt > scryer-provenance-validation.sha256
          echo "base64_subjects=$(base64 < scryer-provenance-validation.sha256 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload validation subject
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scryer-provenance-validation-${{ github.run_id }}
          path: scryer-provenance-validation.txt
          if-no-files-found: error
          retention-days: 5

  generate-provenance:
    name: generate-nonpublishing-provenance
    needs: [prepare-subject]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.prepare-subject.outputs.base64_subjects }}
      provenance-name: scryer-provenance-validation.intoto.jsonl

  verify-provenance:
    name: verify-nonpublishing-provenance
    needs: [prepare-subject, generate-provenance]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validation subject
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scryer-provenance-validation-${{ github.run_id }}
          path: validation

      - name: Download validation provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scryer-provenance-validation.intoto.jsonl
          path: validation

      - name: Install SLSA verifier
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/slsa-framework/slsa-verifier/v2/cli/slsa-verifier@v2.7.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify generated SLSA provenance
        working-directory: validation
        shell: bash
        run: |
          set -euo pipefail
          slsa-verifier verify-artifact \
            --provenance-path scryer-provenance-validation.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-branch main \
            scryer-provenance-validation.txt

      # Mirrors the dual Cosign v2 + v3 blob signing in scryer.yml.
      - name: Install Cosign v2
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
          install-dir: $HOME/.cosign-v2

      - name: Install Cosign v3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
          install-dir: $HOME/.cosign-v3

      - name: Verify keyless checksum signing
        working-directory: validation
        shell: bash
        run: |
          set -euo pipefail
          sha256sum scryer-provenance-validation.txt > scryer-checksums.txt
          identity="https://github.com/${{ github.repository }}/.github/workflows/release-provenance-validation.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"

          "$HOME/.cosign-v2/cosign" sign-blob --yes \
            --bundle scryer-checksums.txt.sigstore.json \
            scryer-checksums.txt
          "$HOME/.cosign-v2/cosign" verify-blob \
            --bundle scryer-checksums.txt.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            scryer-checksums.txt
          jq -e 'has("base64Signature") and has("rekorBundle")' \
            scryer-checksums.txt.sigstore.json >/dev/null

          "$HOME/.cosign-v3/cosign" sign-blob --yes \
            --bundle scryer-checksums.txt.cosign-v3.sigstore.json \
            scryer-checksums.txt
          "$HOME/.cosign-v3/cosign" verify-blob \
            --bundle scryer-checksums.txt.cosign-v3.sigstore.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" \
            scryer-checksums.txt
          jq -e '(.mediaType | startswith("application/vnd.dev.sigstore.bundle"))
                 and (.verificationMaterial.tlogEntries | length == 1)
                 and (.verificationMaterial.tlogEntries[0].kindVersion
                      == {"kind": "hashedrekord", "version": "0.0.1"})' \
            scryer-checksums.txt.cosign-v3.sigstore.json >/dev/null
