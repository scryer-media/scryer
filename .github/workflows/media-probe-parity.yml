name: media-probe-parity

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Comma-separated fixture basenames; leave empty for the complete fixture corpus
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: media-probe-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install development reference and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg nasm mold
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: nextest
      - name: Record reference version and source revision
        run: |
          mkdir -p media-parity-results
          ffprobe -version > media-parity-results/ffprobe-version.txt
          git rev-parse HEAD > media-parity-results/source-revision.txt
      - name: Check mandatory native fixtures and production projections
        run: |
          set -o pipefail
          cargo nextest run --locked -p scryer-mediainfo -p scryer-application --features scryer-application/runtime-media-analysis --no-fail-fast -E 'binary(native_tests) | test(sparse_mkv_authored) | test(sparse_mkv_reference) | test(asf::tests::marker) | test(canonical_catalog_and_import_paths_preserve_the_same_analysis_contract)' 2>&1 | tee media-parity-results/native.txt
      - name: Compare structured native metadata with FFprobe
        if: ${{ !cancelled() }}
        env:
          SCRYER_PARITY_FIXTURES: ${{ inputs.fixtures }}
          SCRYER_PARITY_REPORT: ${{ github.workspace }}/media-parity-results/comparison.json
        run: |
          set -o pipefail
          cargo nextest run --locked -p scryer-mediainfo --run-ignored all --no-fail-fast -E 'test(compare_fixture_corpus_against_ffprobe) | test(compare_explicit_sparse_mkv) | test(asf_marker_chapter_reference_matches_ffprobe)' --success-output immediate 2>&1 | tee media-parity-results/reference.txt
      - name: Retain comparison evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-probe-parity-${{ github.run_id }}
          path: media-parity-results
          if-no-files-found: error
          retention-days: 14
