name: Download verified built-ins
description: Restore the verified, pinned built-in plugin inputs before Cargo compiles them.

inputs:
  run-id:
    description: GitHub Actions run identifier that produced the inputs.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: scryer-builtins-${{ inputs.run-id }}
        path: crates/scryer-plugins/builtins

    - name: Verify downloaded built-ins
      shell: bash
      run: |
        set -euo pipefail
        test -s crates/scryer-plugins/builtins/newznab_indexer.wasm.zst
        test -s crates/scryer-plugins/builtins/newznab_indexer.descriptor.json
        test -s crates/scryer-plugins/builtins/newznab_indexer.description.txt
        test -s crates/scryer-plugins/builtins/torznab_indexer.wasm.zst
        test -s crates/scryer-plugins/builtins/torznab_indexer.descriptor.json
        test -s crates/scryer-plugins/builtins/torznab_indexer.description.txt
        test -s crates/scryer-plugins/builtins/provenance.json
