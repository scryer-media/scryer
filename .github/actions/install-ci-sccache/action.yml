name: Install CI compiler cache
description: Install the pinned compiler cache with bounded retries for download failures.
runs:
  using: composite
  steps:
    - id: first
      continue-on-error: true
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
      with:
        tool: sccache@0.17.0
    - id: second
      if: steps.first.outcome == 'failure'
      continue-on-error: true
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
      with:
        tool: sccache@0.17.0
    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
      with:
        tool: sccache@0.17.0
    - name: Check installed version
      shell: bash
      run: test "$(sccache --version)" = 'sccache 0.17.0'
