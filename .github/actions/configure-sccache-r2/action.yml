name: Configure sccache R2
description: Configure a trusted CI build to use S3-compatible Cloudflare R2 storage.

inputs:
  endpoint:
    description: S3-compatible R2 endpoint.
    required: true
  access-key-id:
    description: S3-compatible access key ID.
    required: true
  secret-access-key:
    description: S3-compatible secret access key.
    required: true
  key-prefix:
    description: R2 object-key prefix for this compiler target.
    required: true

runs:
  using: composite
  steps:
    - name: Configure disk and R2 cache layers
      shell: bash
      env:
        SCCACHE_R2_ENDPOINT_INPUT: ${{ inputs.endpoint }}
        SCCACHE_R2_ACCESS_KEY_ID_INPUT: ${{ inputs.access-key-id }}
        SCCACHE_R2_SECRET_ACCESS_KEY_INPUT: ${{ inputs.secret-access-key }}
        SCCACHE_R2_KEY_PREFIX_INPUT: ${{ inputs.key-prefix }}
      run: |
        set -euo pipefail
        for required in \
          SCCACHE_R2_ENDPOINT_INPUT \
          SCCACHE_R2_ACCESS_KEY_ID_INPUT \
          SCCACHE_R2_SECRET_ACCESS_KEY_INPUT \
          SCCACHE_R2_KEY_PREFIX_INPUT; do
          if [ -z "${!required}" ]; then
            echo "missing required sccache R2 configuration: ${required}" >&2
            exit 1
          fi
        done

        printf '::add-mask::%s\n' "$SCCACHE_R2_ENDPOINT_INPUT"
        printf '::add-mask::%s\n' "$SCCACHE_R2_ACCESS_KEY_ID_INPUT"
        printf '::add-mask::%s\n' "$SCCACHE_R2_SECRET_ACCESS_KEY_INPUT"

        {
          printf '%s\n' 'RUSTC_WRAPPER=sccache'
          printf '%s\n' 'SCRYER_SCCACHE_ENABLED=true'
          printf '%s\n' 'SCCACHE_MULTILEVEL_CHAIN=disk,s3'
          printf '%s\n' 'SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY=l0'
          printf '%s\n' 'SCCACHE_IGNORE_SERVER_IO_ERROR=1'
          printf '%s\n' 'SCCACHE_BUCKET=release-sccache'
          printf 'SCCACHE_ENDPOINT=%s\n' "$SCCACHE_R2_ENDPOINT_INPUT"
          printf '%s\n' 'SCCACHE_REGION=auto'
          printf '%s\n' 'SCCACHE_S3_USE_SSL=true'
          printf 'SCCACHE_S3_KEY_PREFIX=%s\n' "$SCCACHE_R2_KEY_PREFIX_INPUT"
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$SCCACHE_R2_ACCESS_KEY_ID_INPUT"
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$SCCACHE_R2_SECRET_ACCESS_KEY_INPUT"
        } >> "$GITHUB_ENV"
