# Hashing policy guard.
#
# First-party identity hashing goes through
# `scryer_application::blake3_identity_hex` with a `HashDomain` variant; see the
# policy on that function in crates/scryer-application/src/helpers.rs. Every
# other digest and MAC algorithm is disallowed here so that reaching for
# SHA-256, SHA-1, MD5 or HMAC fails `cargo clippy -D warnings` unless the site
# is one of the documented external-contract exceptions. An exception carries
# `#[allow(clippy::disallowed_methods)]` or `#[allow(clippy::disallowed_types)]`
# on the smallest enclosing item, with a comment naming the contract that fixes
# the algorithm. Do not add an allow for a hash that is ours to choose.

# Disk operations guard.
#
# Code reaches the filesystem only through `scryer_application::disk`, which
# re-exports the disk service crate (crates/scryer-disk/). The
# disallowed-methods entries whose reason reads "disk operations go through
# scryer_application::disk" ban the std, tokio, platform and third-party calls
# that touch the disk, so a direct call fails `cargo clippy -D warnings`
# outside an allowed scope.
#
# The only standing exemptions are: the disk service crate itself; test,
# example, bench and build-script code; the plugin WASI sandbox, which manages
# its own preopened directories; and exactly three crates:
#   - scryer-launcher, the container entrypoint. It prepares the config
#     directory and replaces itself with the server before any service exists,
#     and it depends on libc alone.
#   - scryer-mediainfo, the media parser. It opens the one file it is asked to
#     describe and reads it through its own handle.
#   - scryer-mock-apis, fixture tooling that is not part of a Scryer install.
# No other crate is exempt, whatever it depends on. Each exemption
# carries `allow(clippy::disallowed_methods)` with a `// disk-guard:` comment
# saying which exemption it is. Until a crate is converted it carries one
# crate-level allow marked `// disk-guard: this crate still calls the
# filesystem directly; ...`; that allow is removed when the crate is converted,
# and no new one is added.
#
# The disk guard and the hashing guard share the disallowed_methods lint, so an
# allow silences both. An allow for a disk call must not be used to reach a
# hash, and an allow for a hash must not be used to reach the disk.
#
# Entries with `allow-invalid = true` name platform-specific or optional
# dependency paths that do not resolve in every crate or on every lint target
# (Linux musl and Windows).

disallowed-methods = [
