type WantedItemPayload {
	"""
	Scope identity: the acquisition-state row id when a state row
	exists for this scope, otherwise the convergence scope key itself
	(`episode:<uuid>`, `title:<uuid>`, `series_movie:<uuid>`, …). A derived
	target with no state row is still addressable by this id (pause/resume and
	the interactive search job both accept a scope key here).
	"""
	id: ID!
	titleId: ID!
	titleName: String
	titleSlug: String
	titleFacet: String
	libraryId: ID
	libraryName: String
	librarySlug: String
	episodeId: ID
	collectionId: ID
	seasonNumber: String
	episodeNumber: String
	mediaType: WantedMediaTypeValue!
	lastSearchAt: DateTime
	status: WantedStatusValue!
	grabbedRelease: String
	"""
	Safe indexer/provider label for the grabbed release, when known.
	"""
	sourceProvider: String
	currentScore: Int
	latestReleaseDecision: ReleaseDecisionPayload
	mismatchRecoveryEligible: Boolean!
	"""
	Convergence progress for this scope: whether the scope is
	still sweeping indexers, has converged (watching RSS), is queued, or is
	deferred because every uncovered indexer is currently unavailable.
	"""
	convergenceState: ConvergenceStateValue!
	"""
	Routed indexers already searched under the current fingerprint.
	"""
	indexersCovered: Int!
	"""
	Routed-enabled indexers for this scope.
	"""
	indexersRouted: Int!
	"""
	Recency lane: `Hot` converges promptly, `Cold` drains under
	scheduler backpressure.
	"""
	recencyLane: RecencyLaneValue!
	createdAt: DateTime!
	updatedAt: DateTime!
	title: TitlePayload
	collection: CollectionPayload
	episode: EpisodePayload
	releaseDecisions(limit: Int! = 50, offset: Int! = 0): ReleaseDecisionsPagePayload!
	pendingReleases(limit: Int! = 50, offset: Int! = 0): PendingReleasesPayload!
}

type WantedItemsListPayload {
	items: [WantedItemPayload!]!
	totalCount: Int!
	hasMore: Boolean!
}

type WantedItemsPagePayload {
	items: [WantedItemPayload!]!
}

