[package]
name = "scryer-disk"
version = "0.22.4"
edition.workspace = true

[features]
default = []
# Seams for the tests of crates that build on the disk service: a clock moved
# by hand and the class a path resolves to. Never enabled in a shipped build.
test-support = []

[dependencies]
blake3 = "1"
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = "0.1"
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
