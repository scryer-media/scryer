[package]
name = "scryer-infrastructure-library-search"
version = "0.21.9"
edition.workspace = true
publish = false

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
# The fuzzy lane. Default features pull in a zstd/brotli stack and the
# directory watcher we do not use: mmap is the only directory this opens and
# lz4 is the block compressor the store is written with.
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
