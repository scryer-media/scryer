query HistoryItem($id: Int!) {
  historyItem(id: $id) {
    id
    name
    originalTitle
    state
    error
    progressPercent
    totalBytes
    category
    outputDir
    createdAt
    completedAt
    clientRequestId
    attributes {
      key
      value
    }
    attention {
      code
      message
    }
  }
}
