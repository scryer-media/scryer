query QueueItems($filter: QueueFilterInput) {
  queueItems(filter: $filter) {
    id
    name
    originalTitle
    state
    error
    progressPercent
    totalBytes
    category
    outputDir
    createdAt
    clientRequestId
    attributes {
      key
      value
    }
    attention {
      code
      message
    }
  }
}
