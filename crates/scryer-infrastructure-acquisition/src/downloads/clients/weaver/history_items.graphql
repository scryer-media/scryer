query HistoryItems($filter: QueueFilterInput, $first: Int, $after: String) {
  historyItems(filter: $filter, first: $first, after: $after) {
    id
    name
    originalTitle
    state
    error
    progressPercent
    totalBytes
    category
    outputDir
    createdAt
    completedAt
    clientRequestId
    attributes {
      key
      value
    }
    attention {
      code
      message
    }
  }
}
