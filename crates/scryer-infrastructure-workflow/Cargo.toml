[package]
name = "scryer-infrastructure-workflow"
version = "0.19.4"
edition.workspace = true
publish = false

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
scryer-infrastructure-crypto = { path = "../scryer-infrastructure-crypto" }
async-trait = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
