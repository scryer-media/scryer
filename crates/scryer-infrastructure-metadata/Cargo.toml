[package]
name = "scryer-infrastructure-metadata"
version = "0.19.8"
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-infrastructure-library = { path = "../scryer-infrastructure-library" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "gzip", "brotli", "zstd", "deflate", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }

[dev-dependencies]
scryer-infrastructure-datastore = { path = "../scryer-infrastructure-datastore" }
wiremock = { workspace = true }

[build-dependencies]
graphql-parser = "0.4"
