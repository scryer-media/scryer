query SearchTvdbBatch($requests: [TvdbSearchBatchRequestInput!]!, $language: String!) {
  searchTvdbBatch(requests: $requests, language: $language) {
    query
    type
    year
    results {
      tvdb_id
      title_id
      external_ids {
        source
        kind
        id
        key
      }
      name
      year
      auto_match_safe
      auto_match_signals
    }
  }
}
