query GetSeries($id: String!, $includeEpisodes: Boolean!, $language: String!) {
  series(id: $id, includeEpisodes: $includeEpisodes, language: $language) {
    series {
      tvdb_id
      name
      sort_name
      slug
      status
      year
      first_aired
      overview
      network
      runtime_minutes
      poster_url
      original_language
      country
      canonical_tags {
        key
        category
        name
        confidence
        sources
        source_tag_keys
        is_adult
        is_spoiler
      }
      rating
      rating_sources
      external_ratings {
        source
        value
        score
        normalized
        votes
        url
      }
      credits {
        kind
        person_id
        person_name
        person_original_name
        person_image_url
        person_source
        person_external_id
        character_name
        language
        billing_order
        episode_count
      }
      aliases
      tagged_aliases {
        name
        language
      }
      artworks {
        kind
        url
      }
      seasons {
        tvdb_id
        number
        label
        episode_type
      }
      episodes {
        tvdb_id
        episode_number
        season_number
        name
        aired
        runtime_minutes
        is_filler
        is_recap
        overview
        absolute_number
        image_url
      }
      anime_mappings {
        mal_id
        mal_dub_id
        anilist_id
        anidb_id
        kitsu_id
        simkl_id
        thetvdb_id
        themoviedb_id
        imdb_id
        trakt_id
        alt_tvdb_id
        thetvdb_season
        thetvdb_part
        score
        anime_media_type
        global_media_type
        status
        mapping_type
        episode_mappings {
          tvdb_season
          episode_start
          episode_end
        }
      }
      anime_numbering_bridge {
        generated_on
        corroborating_order
        seasons {
          index
          anidb_id
          anilist_id
          mal_id
          titles
          ranges {
            community_episode_start
            community_episode_end
            tvdb_season
            tvdb_episode_start
            tvdb_episode_end
          }
          absolute_start
          episode_count
        }
      }
      anime_movies {
        movie_tvdb_id
        movie_tmdb_id
        movie_imdb_id
        movie_mal_id
        movie_anidb_id
        name
        slug
        year
        content_status
        overview
        poster_url
        language
        runtime_minutes
        sort_title
        imdb_id
        studio
        digital_release_date
        association_confidence
        continuity_status
        movie_form
        placement
        confidence
        signal_summary
      }
    }
  }
}
