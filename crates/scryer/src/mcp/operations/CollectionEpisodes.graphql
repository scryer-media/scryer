# The episodes of one collection, for a rule test's episode id.
query CollectionEpisodes($id: ID!) {
  collectionById(id: $id) {
    id
    titleId
    collectionType
    collectionIndex
    label
    episodes {
      id
      seasonNumber
      episodeNumber
      absoluteNumber
      episodeLabel
      title
      airDate
    }
  }
}
