[package]
name = "scryer"
version = "0.21.10"
edition.workspace = true

[features]
default = []
# Test-harness images only: sync SCRYER_DEV_API_KEYS in a binary built without
# debug assertions. Never enable this for a shipped build.
e2e-harness = []
# Periodic heap-profile dumps for load-test / benchmark images. jemalloc's
# sampling profiler is compiled into every non-Windows build (see the
# `tikv-jemallocator` dependency below) and is inert until `MALLOC_CONF` turns
# it on, so this feature adds only the background thread that dumps profiles on
# a timer. Configure jemalloc through MALLOC_CONF, e.g.
# `prof:true,prof_active:true,prof_accum:true,lg_prof_sample:19`.
# No effect on Windows, which uses mimalloc.
jemalloc-prof = []

[dependencies]
application-updater = { git = "https://github.com/scryer-media/application-updater.git", tag = "v0.1.0" }
scryer-application = { path = "../scryer-application", features = ["runtime"] }
scryer-domain = { path = "../scryer-domain" }
scryer-interface = { path = "../scryer-interface" }
scryer-infrastructure-acquisition = { path = "../scryer-infrastructure-acquisition" }
scryer-infrastructure-configuration = { path = "../scryer-infrastructure-configuration" }
scryer-infrastructure-crypto = { path = "../scryer-infrastructure-crypto" }
scryer-infrastructure-datastore = { path = "../scryer-infrastructure-datastore" }
scryer-infrastructure-identity = { path = "../scryer-infrastructure-identity" }
scryer-infrastructure-library = { path = "../scryer-infrastructure-library" }
scryer-infrastructure-metadata = { path = "../scryer-infrastructure-metadata" }
scryer-infrastructure-notifications = { path = "../scryer-infrastructure-notifications" }
scryer-infrastructure-runtime = { path = "../scryer-infrastructure-runtime" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
scryer-infrastructure-workflow = { path = "../scryer-infrastructure-workflow" }
scryer-logging = { path = "../scryer-logging" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-plugins = { path = "../scryer-plugins" }
scryer-rules = { path = "../scryer-rules" }
scryer-runtime-info = { path = "../scryer-runtime-info" }
async-graphql = { workspace = true }
async-graphql-axum = { version = "7.2" }
axum = { version = "0.8", features = ["macros", "http1", "http2", "json", "multipart", "ws"] }
futures-util = "0.3"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "compression-zstd"] }
http = "1.5"
dotenvy = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
aws-lc-rs = { workspace = true }
brotli = "8"
flate2 = "1"
percent-encoding = "2"
toml = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-util = { version = "0.20", default-features = false }
directories = "6"
open = "5"
governor = { workspace = true }
webauthn-rs = { workspace = true }
url = "2"

# Scryer does not use the system allocator anywhere. glibc's never plateaus on
# this workload (it ratchets to ~3 GB on the 111k-item load-test library and is
# still climbing after 30 minutes), and the measured alternatives both fix
# that. jemalloc wins everywhere it can be used: same binary, same library,
# ~503 MB resident against glibc's 1,382 MB with arenas capped and mimalloc's
# 1,113 MB tuned. Windows has no jemalloc, so it gets mimalloc.
#
# `profiling` and `stats` are compiled in unconditionally. Both are inert until
# `MALLOC_CONF` asks for them, and having them in every build means a
# production instance can be profiled where it runs instead of being rebuilt
# first. `unprefixed_malloc_on_supported_platforms` is what makes jemalloc read
# `MALLOC_CONF` rather than `_RJEM_MALLOC_CONF`.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "0.7", features = [
    "profiling",
    "stats",
    "unprefixed_malloc_on_supported_platforms",
] }
tikv-jemalloc-ctl = { version = "0.7", features = ["use_std"] }

[dev-dependencies]
async-trait = { workspace = true }
# `test-util` gives tests a paused clock: a test observes a timer by the
# virtual time it advances rather than by wall-clock elapsed time.
tokio = { workspace = true, features = ["test-util"] }
chrono = { workspace = true }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
wiremock = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "gzip", "brotli", "deflate"] }
tempfile = "3"

[build-dependencies]
embed-resource = "3.0.11"
scryer-runtime-info = { path = "../scryer-runtime-info" }

[[bin]]
name = "scryer-tray"
path = "src/tray.rs"

[target.'cfg(unix)'.dependencies]
# `SIGTERM` for the tray's graceful stop of its server child.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows' global allocator. mimalloc vendors both v2 and v3 and builds v3
# unless the `v2` feature is set. `libmimalloc-sys/extended` is what exposes
# `mi_option_set`, which main.rs uses to turn the decommit purge off at startup.
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  # `CreateMutexW` and `RegCreateKeyExW` take `SECURITY_ATTRIBUTES`, whose type
  # this feature defines. Another crate in the graph currently enables it too,
  # but this crate must not compile only by that accident of feature
  # unification.
  "Win32_Security",
  # `WM_MOUSELEAVE`, which the tray flyout tracks the pointer with. The message
  # is defined beside the common controls that first raised it, not beside the
  # `TrackMouseEvent` that asks for it.
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  # `TrackMouseEvent` itself, and the `GetKeyState`/`VK_CONTROL` the Ctrl+W
  # accelerator reads.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# The desktop wrapper's embedded browser. webview2-com-sys vendors
# WebView2LoaderStatic.lib and links it statically, so scryer-tray.exe gains no
# DLL dependency and the packaged file list is unchanged.
webview2-com = "0.39"
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_System_Com",
] }

# The macOS desktop wrapper. Every objc2 crate gates each class behind its own
# feature, so these lists are exactly the classes and protocols the wrapper
# names.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSDistributedNotificationCenter",
  "NSEnumerator",
  "NSGeometry",
  "NSNotification",
  "NSObjCRuntime",
  "NSRunLoop",
  "NSString",
  "NSThread",
  "NSTimer",
  "NSURL",
  "NSURLRequest",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAccessibilityProtocols",
  "NSAlert",
  "NSAppearance",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSGraphics",
  "NSImage",
  "NSImageRep",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSParagraphStyle",
  "NSPopover",
  "NSProgressIndicator",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSScreen",
  "NSStackView",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSTextField",
  "NSTrackingArea",
  "NSUserInterfaceLayout",
  "NSView",
  "NSViewController",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKOpenPanelParameters",
  "WKUIDelegate",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWindowFeatures",
] }
