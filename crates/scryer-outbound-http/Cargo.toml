[package]
name = "scryer-outbound-http"
version = "0.20.0"
edition.workspace = true

[dependencies]
# `socks` turns on reqwest's built-in SOCKS4/5 connector for operator-configured
# transport proxies. It adds no crate to the tree: reqwest implements SOCKS over
# the hyper-util `client-proxy` feature it already enables unconditionally.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "deflate", "zstd", "blocking", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
chrono = { workspace = true }
governor = { workspace = true }
