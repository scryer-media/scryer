    access_type
  }
  rank_components {
    name
    value
  }
  source_count
  edge_count
  relation_count
  source_subject_count
  rank_score
  best_source
  matched_subject_keys
  matched_subject_titles
  matched_subject_count
  tmdb_collection_id
