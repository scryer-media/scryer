query DiscoveryContextSnapshotPage($requestId: String!, $page: Int!) {
  discoveryContextSnapshotPage(requestId: $requestId, page: $page) {
    request_id
    page
    page_count
    generated_at
    discovery_index_watermark
    facets {
      name
      values {
        value
        count
      }
    }
    items {
      ...DiscoveryContextSnapshotTitleFields
    }
  }
}

fragment DiscoveryContextSnapshotTitleFields on DiscoveryContextSnapshotTitle {
  target_key
  target_kind
  resolved
  resolved_title_id
  display_title
  original_title
  year
  poster_path
  poster_url
  overview
  content_type
  rating
  rating_sources
  rating_provenance {
    metadata_source
    rating_source
    value
    score
    normalized
    votes
    url
  }
  external_ids {
    source
    kind
    id
    key
  }
  status_tags
  background_url
  source_tags {
    source
    category
    key
    name
    rank
    weight
    is_adult
    is_spoiler
  }
  canonical_tags {
    key
    category
    name
    confidence
    sources
    source_tag_keys
    is_adult
    is_spoiler
  }
  is_adult
  content_ratings {
    country
    certifications {
      value
      source
      release_type
    }
    age_rating
    age_rating_source
  }
  sources
  relation_types
  relation_subtypes
  chart_signals {
    source
    chart_key
    scope
    country_iso2
    observed_week
    category
    rank
    score
    score_percent
    signal_kind
    ranking_body_key
    ranking_body_name
    ranking_body_kind
    source_url
    source_title
    source_published_at
    source_total_votes
    anime_season
    anime_season_year
    anime_season_week
    anime_signal_phase
    anime_signal_category
    attribution
