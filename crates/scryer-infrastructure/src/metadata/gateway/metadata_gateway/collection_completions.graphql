query CollectionCompletions($input: DiscoveryCollectionCompletionInput!) {
  collectionCompletions(input: $input) {
    subject_keys
    generated_at
    results {
      ...DiscoveryCollectionCompletionTitleFields
    }
  }
}

fragment DiscoveryCollectionCompletionTitleFields on DiscoveryCollectionCompletionTitle {
  target_key
  target_kind
  resolved
  resolved_title_id
  display_title
  original_title
  year
  poster_path
  poster_url
  overview
  content_type
  rating
  rating_sources
  rating_provenance {
    metadata_source
    rating_source
    value
    score
    normalized
    votes
    url
  }
  external_ids {
    source
    kind
    id
    key
  }
  status_tags
  background_url
  source_tags {
    source
    category
    key
    name
    rank
    weight
    is_adult
    is_spoiler
  }
  canonical_tags {
    key
    category
    name
    confidence
    sources
    source_tag_keys
    is_adult
    is_spoiler
  }
  is_adult
  content_ratings {
    country
    certifications {
      value
      source
      release_type
    }
    age_rating
    age_rating_source
  }
  sources
  relation_types
  relation_subtypes
  rank_components {
    name
    value
  }
  source_count
  edge_count
  relation_count
  source_subject_count
  rank_score
  best_source
  matched_subject_keys
  matched_subject_titles
  matched_subject_count
  tmdb_collection_id
  tmdb_collection_name
}
