[package]
name = "scryer-infrastructure-library"
version = "0.19.12"
edition.workspace = true
publish = false

[features]
default = ["image-processing"]
image-processing = ["dep:fast_image_resize", "dep:image", "dep:kamadak-exif", "dep:zune-core"]

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
scryer-infrastructure-crypto = { path = "../scryer-infrastructure-crypto" }
scryer-infrastructure-workflow = { path = "../scryer-infrastructure-workflow" }
scryer-infrastructure-library-search = { path = "../scryer-infrastructure-library-search" }
async-trait = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
fast_image_resize = { version = "6", optional = true }
image = { version = "0.25", default-features = false, features = ["avif", "jpeg", "png", "webp"], optional = true }
kamadak-exif = { version = "0.6", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "gzip", "brotli", "zstd", "deflate", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-normalization = "0.1"
url = "2"
uuid = { workspace = true }
zstd = { version = "0.13", default-features = false }
zune-core = { version = "=0.5.3", optional = true }

[dev-dependencies]
scryer-infrastructure-datastore = { path = "../scryer-infrastructure-datastore" }
tempfile = "3"
zstd = { version = "0.13", default-features = false, features = ["zdict_builder"] }
