[package]
name = "scryer-plugins"
version = "0.20.0"
edition.workspace = true

[dependencies]
scryer-application = { path = "../scryer-application" }
scryer-domain = { path = "../scryer-domain" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
scryer-rules = { path = "../scryer-rules" }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
aws-lc-rs = { workspace = true }
crc-fast = "1.10.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
quick-xml = { workspace = true }
base64 = { workspace = true }
glob = "0.3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
uuid = { workspace = true }
zstd = { version = "0.13", default-features = false }
tempfile = "3"
libc = "0.2"
blake3 = "1"
# RFC 123 WP1: native wasmtime archive host (crypto ABI + command protocol).
wasmparser = "0.254"
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[build-dependencies]
wat = "1"

[dev-dependencies]
# Tests keep readable inline WAT and explicitly translate it to bytes.
wat = "1"
# The in-process SSH server double, so tunnel tests prove egress really
# travelled through a tunnel rather than merely failing to go direct.
scryer-tunnel = { path = "../scryer-tunnel", features = ["test-support"] }
wiremock = { workspace = true }
