[package]
name = "scryer-plugin-sdk"
version = "3.10.0"
edition.workspace = true
description = "Deprecated direct plugin SDK; use scryer-plugin-pdk for new Scryer plugins"
license = "GPL-3.0-only"
repository = "https://github.com/scryer-media/scryer"
readme = "README.md"

[features]
default = []

[dependencies]
base64 = "0.23"
schemars = "1"
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
postcard = { version = "1", default-features = false, features = ["use-std"] }
