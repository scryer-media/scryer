[package]
name = "scryer-plugin-sdk"
version = "3.1.0"
edition.workspace = true
description = "SDK for building Scryer WebAssembly plugins"
license = "GPL-3.0-only"
repository = "https://github.com/scryer-media/scryer"

[features]
default = []
host-runtime = ["dep:extism"]

[dependencies]
base64 = "0.22"
extism-manifest = { version = "1.21", default-features = false }
schemars = "1"
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
extism = { workspace = true, optional = true }
