[package]
name = "scryer-infrastructure-runtime"
version = "0.19.11"
edition.workspace = true
publish = false

[features]
default = ["image-processing"]
image-processing = ["scryer-infrastructure-library/image-processing"]
runtime-backups = ["scryer-application/runtime-backups"]

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-outbound-http = { path = "../scryer-outbound-http" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
scryer-infrastructure-crypto = { path = "../scryer-infrastructure-crypto" }
scryer-infrastructure-datastore = { path = "../scryer-infrastructure-datastore" }
scryer-infrastructure-library = { path = "../scryer-infrastructure-library", default-features = false }
scryer-infrastructure-library-search = { path = "../scryer-infrastructure-library-search" }
scryer-infrastructure-workflow = { path = "../scryer-infrastructure-workflow" }
scryer-infrastructure-acquisition = { path = "../scryer-infrastructure-acquisition" }
scryer-infrastructure-metadata = { path = "../scryer-infrastructure-metadata" }
scryer-infrastructure-configuration = { path = "../scryer-infrastructure-configuration" }
scryer-infrastructure-identity = { path = "../scryer-infrastructure-identity" }
scryer-infrastructure-notifications = { path = "../scryer-infrastructure-notifications" }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
aws-lc-rs = { workspace = true }
scryer-plugin-sdk = { path = "../scryer-plugin-sdk" }
tempfile = "3"
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }
zstd = { version = "0.14", default-features = false }
