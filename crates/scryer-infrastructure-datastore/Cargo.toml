[package]
name = "scryer-infrastructure-datastore"
version = "0.19.11"
edition.workspace = true
publish = false
build = "build.rs"

[dependencies]
scryer-domain = { path = "../scryer-domain" }
scryer-application = { path = "../scryer-application" }
scryer-rules = { path = "../scryer-rules" }
scryer-infrastructure-sql = { path = "../scryer-infrastructure-sql" }
scryer-infrastructure-crypto = { path = "../scryer-infrastructure-crypto" }
scryer-infrastructure-library-search = { path = "../scryer-infrastructure-library-search" }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = "1"
chrono = { workspace = true }
libsqlite3-sys = { version = "0.38.0", default-features = false, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sha2 = "0.11"
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { version = "0.14", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }
security-framework-sys = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = { workspace = true }
windows-native-keyring-store = { workspace = true }

[build-dependencies]
blake3 = "1"
cc = "1.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
toml = { workspace = true }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
scryer-infrastructure-configuration = { path = "../scryer-infrastructure-configuration" }
scryer-infrastructure-identity = { path = "../scryer-infrastructure-identity" }
scryer-infrastructure-library = { path = "../scryer-infrastructure-library" }
tempfile = "3"
tracing-subscriber = { workspace = true }
url = "2"
