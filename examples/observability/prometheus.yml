# Minimal Prometheus configuration for scraping Scryer.
#
# Scryer only serves /metrics when SCRYER_METRICS=1 is set on the container, and
# the route requires an API key whose owner has the Manage System Settings
# permission. Create the key in Scryer under Settings -> Security -> API keys,
# write it to a file that only Prometheus can read, and point credentials_file
# at it. Never put the key inline in a config that is committed anywhere.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/scryer-alerts.yml

scrape_configs:
  - job_name: scryer
    metrics_path: /metrics
    scrape_interval: 15s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/scryer_api_key
    static_configs:
      - targets: ["scryer:8080"]
        labels:
          instance: scryer-prod

    # If Scryer terminates TLS itself with a private CA:
    # scheme: https
    # tls_config:
    #   ca_file: /etc/prometheus/scryer-ca.pem
