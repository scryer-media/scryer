[workspace]
members = [
    "xtask",
    "xtask-release",
    "xtask-migrations",
    "xtask-support",
    "xtask-trash-guides",
    "crates/scryer-domain",
    "crates/scryer-application",
    "crates/scryer-webauthn",
    "crates/scryer-outbound-http",
    "crates/scryer-release-parser",
    "crates/scryer-infrastructure-sql",
    "crates/scryer-infrastructure-crypto",
    "crates/scryer-infrastructure-library",
    "crates/scryer-infrastructure-library-search",
    "crates/scryer-infrastructure-workflow",
    "crates/scryer-infrastructure-acquisition",
    "crates/scryer-infrastructure-metadata",
    "crates/scryer-infrastructure-configuration",
    "crates/scryer-infrastructure-identity",
    "crates/scryer-infrastructure-notifications",
    "crates/scryer-infrastructure-datastore",
    "crates/scryer-infrastructure-runtime",
    "crates/scryer-interface-acquisition",
    "crates/scryer-interface-core",
    "crates/scryer-interface-import",
    "crates/scryer-interface-media-types",
    "crates/scryer-interface-media",
    "crates/scryer-interface-metadata",
    "crates/scryer-interface-query",
    "crates/scryer-interface-security",
    "crates/scryer-interface-settings",
    "crates/scryer-interface-subscription",
    "crates/scryer-interface-system",
    "crates/scryer-interface",
    "crates/scryer-rules",
    "crates/scryer-plugin-sdk",
    "crates/scryer-plugins",
    "crates/scryer-runtime-info",
    "crates/scryer-logging",
    "crates/scryer-launcher",
    "crates/scryer",
    "crates/scryer-mock-apis",
    "crates/scryer-mediainfo",
]
exclude = ["test-plugins/test-indexer"]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
dotenvy = "0.15"
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
async-graphql = { version = "7.2", default-features = false, features = ["chrono", "dataloader"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rand_core = "0.10"
webauthn-rs = { package = "scryer-webauthn", path = "crates/scryer-webauthn" }
# SQLite is compiled in via sqlx-sqlite -> libsqlite3-sys bundled mode for single-executable
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite-bundled", "postgres", "json", "chrono", "migrate"] }
argon2 = "0.6"
aws-lc-rs = { version = "1.18", default-features = false, features = ["non-fips"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
toml = "1"
quick-xml = "0.42.0"
# Native Wasmtime hosts for command-model archive plugins and legacy reactor
# compatibility.
wasmtime = { version = "48", default-features = false, features = ["runtime", "cranelift", "std", "component-model-async", "cache"] }
wasmtime-wasi = { version = "48", default-features = false, features = ["p1", "p2"] }
semver = "1"
metrics = "0.24"
security-framework = "3"
security-framework-sys = "2"
keyring-core = "1"
windows-native-keyring-store = "1"
wiremock = "0.6"
strum = { version = "0.28", features = ["derive"] }
governor = "0.10.4"
criterion = "0.8.2"
fixedbitset = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
debug = 0
split-debuginfo = "off"
incremental = false

[profile.e2e]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
debug = 1
strip = false
incremental = true

[profile.release-launcher]
inherits = "release"
opt-level = "z"
lto = "thin"

[profile.release-lean]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"

[profile.release-windows-portable]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.release-lean.package.scryer-interface]
opt-level = 2

[profile.release-lean.package.scryer-interface-core]
opt-level = 2

