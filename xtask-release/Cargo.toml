[package]
name = "xtask-release"
version = "0.15.9"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = { workspace = true }
blake3 = "1.8"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dotenvy = { workspace = true }
flate2 = "1"
quick-xml = { workspace = true, features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
scryer-application = { path = "../crates/scryer-application" }
scryer-plugins = { path = "../crates/scryer-plugins" }
scryer-plugin-sdk = { path = "../crates/scryer-plugin-sdk" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = "0.4.4"
const-oid = { version = "0.10.2", features = ["db"] }
sigstore = { version = "0.14", default-features = false, features = ["cosign", "sigstore-trust-root", "rustls-tls"] }
rustls-pki-types = "1"
rustls-webpki = "0.103"
tempfile = "3"
tar = "0.4"
tokio = { workspace = true }
toml = "1"
toml_edit = "0.25"
x509-cert = { version = "0.3", default-features = false, features = ["pem", "std"] }
zstd = { version = "0.14", default-features = false }
xtask-support = { path = "../xtask-support" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
